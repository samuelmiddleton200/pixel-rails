<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- no zooming; the game fills the screen -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- opened from the home screen: no Safari bars, black status bar -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- black-translucent: the page always runs under the status bar area, so iOS has no bar-sized strip to
     leave behind when the app opens sideways (the game already keeps clear of the notch itself) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Rails">
<meta name="theme-color" content="#2a1a14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}   /* no bounce, no double-tap zoom */
  /* like an app: the page itself never moves; long menus scroll inside the game area.
     The page is pinned to the screen (position:fixed) so it cannot sit scrolled or pushed off to one side, and its
     height comes from --app-h, the size the script below measures, because an iPhone opened sideways sometimes
     hands the page a stale size or offset for a moment (the "whole screen shifted over" launch). */
  html,body{position:fixed;left:0;top:0;width:100%;height:100%;height:var(--app-h,100%);overflow:hidden}
  #ui{height:100%;height:100dvh;height:var(--app-h,100dvh);min-height:0 !important;overflow:hidden;overscroll-behavior:none}
  #game{height:var(--app-h,100%);bottom:auto !important}
  /* the stats list is the only screen allowed to scroll, and only up and down */
  
</style>
<script>
  // Launch guard for the shifted screen: measure the real screen, pin the page to it, put the page back at 0,0,
  // and if the iPhone is still reporting a stale size make it measure again. Runs at launch, a few more times in
  // the first seconds, and whenever the app comes back, rotates or resizes. It never reloads the app.
  (function(){
    var root = document.documentElement, nudges = 0, last = '';
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = function(){ return navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches); };
    var angle = function(){ var a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : window.orientation; return typeof a === 'number' ? Math.abs(a) % 180 : null; };
    // what the screen really is: on an iPhone home-screen app that is the whole display, turned the way the phone is held
    function real(){
      var w = window.innerWidth, h = window.innerHeight, a = angle();
      if (ios && standalone() && a !== null && screen.width && screen.height) {
        var long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
        var ew = a === 90 ? long : short, eh = a === 90 ? short : long;
        // only a big gap is a stale size (the page still thinks the phone is the other way up); small gaps are real bars
        if (Math.abs(w - ew) > 60 || Math.abs(h - eh) > 60) return { w:ew, h:eh, stale:true };
      }
      return { w:w, h:h, stale:false };
    }
    function settle(){
      try {
        var r = real(), vv = window.visualViewport;
        root.style.setProperty('--app-h', r.h + 'px');
        var moved = window.scrollX || window.scrollY || root.scrollTop || (document.body && document.body.scrollTop) || (vv && (vv.offsetTop || vv.offsetLeft || vv.pageTop || vv.pageLeft));
        if (moved) { window.scrollTo(0, 0); root.scrollTop = 0; if (document.body) document.body.scrollTop = 0; }
        if ((r.stale || moved) && nudges < 6) {                      // make the iPhone lay the page out again
          nudges++;
          var m = document.querySelector('meta[name=viewport]'), c = m && m.getAttribute('content');
          if (m) { m.setAttribute('content', c + ', height=device-height'); setTimeout(function(){ m.setAttribute('content', c); }, 60); }
        }
        var key = r.w + 'x' + r.h + (r.stale ? 's' : '') + (moved ? 'm' : '');
        if (key !== last) { last = key; setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 80); }   // the game re-fits its court
      } catch (e) {}
    }
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    settle();
    [0, 60, 150, 300, 600, 1000, 1600, 2500, 4000].forEach(function(ms){ setTimeout(settle, ms); });
    ['DOMContentLoaded', 'load', 'pageshow', 'resize', 'orientationchange', 'focus'].forEach(function(ev){ window.addEventListener(ev, function(){ settle(); setTimeout(settle, 250); setTimeout(settle, 700); }); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) { nudges = 0; settle(); setTimeout(settle, 250); setTimeout(settle, 700); } });
    if (window.visualViewport) { visualViewport.addEventListener('resize', settle); visualViewport.addEventListener('scroll', settle); }
  })();
</script>
<script>
  // No surprise updates: the app never reloads itself. A new version (only when we publish one) shows the
  // next time the app is closed and opened again, because the game loads fresh from the server at launch.
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).catch(() => {}));
</script>
<title>Pixel Rails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* digits (and $) come from Silkscreen: Pixelify's 5 looks like an S */
@font-face{font-family:"PRDigits";font-weight:400;src:url(https://fonts.gstatic.com/s/silkscreen/v6/m8JXjfVPf62XiF7kO-i9YLNlaw.woff2) format('woff2');unicode-range:U+0024,U+0030-0039;size-adjust:82%}
@font-face{font-family:"PRDigits";font-weight:600 800;src:url(https://fonts.gstatic.com/s/silkscreen/v6/m8JUjfVPf62XiF7kO-i9aAhAfmyi2A.woff2) format('woff2');unicode-range:U+0024,U+0030-0039;size-adjust:82%}
:root{
  --ink:#2a1a14; --wood:#8a5a34; --wood-d:#5e3a20; --wood-l:#b07a4a;
  --paper:#f4e4c1; --paper-d:#e6cf9f; --paper-dd:#cfb17a;
  --red:#b8322f; --green:#3f8a3e; --gold:#e8b23a; --blue:#2f6fb0;
  --px:"Silkscreen","Courier New",monospace;
  --body:"PRDigits","Pixelify Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b1320;color:var(--ink);overflow:hidden}
body{font:15px/1.25 var(--body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#game{position:fixed;inset:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
img.px{image-rendering:pixelated}

/* ---- top HUD ---- */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;
  padding:calc(env(safe-area-inset-top) + 6px) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));pointer-events:none}
.chip{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:8px;
  box-shadow:inset 0 -3px 0 var(--paper-dd);padding:3px 9px 4px;font:700 15px var(--px);white-space:nowrap}
.chip img{width:18px;height:18px}
#money{font-size:17px;color:#2d5a1c}
#where{flex:1;justify-content:center;font-family:var(--body);font-weight:700;font-size:15px;min-width:0;overflow:hidden}
#where .prog{width:90px;height:10px;margin-left:8px;border:2px solid var(--ink);border-radius:3px;background:var(--paper-d);overflow:hidden;flex:none}
#where .prog b{display:block;height:100%;background:var(--gold)}
#where .mi{margin-left:8px;font-size:13px;color:#7a5a3c}
#pauseBtn{cursor:pointer;font:700 14px var(--px);padding:3px 10px 4px}
#pauseBtn.on{background:#ffd166}
#pauseBtn[hidden]{display:none}
#pausedBanner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:rgba(42,26,20,.85);color:#ffd166;border:3px solid #ffd166;border-radius:10px;padding:8px 22px;font:700 26px var(--px);text-align:center;pointer-events:none}
#pausedBanner small{display:block;font:600 13px var(--body);color:#fbe7b5;margin-top:2px}
#pausedBanner[hidden]{display:none}
#news{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 46px);max-width:70%;
  background:rgba(42,26,20,.82);color:#fbe7b5;border-radius:6px;padding:3px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .4s}
#news b{color:#ffd166}

/* ---- bottom bar (Tiny Rails style) ---- */
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;
  padding:0 max(8px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 6px) max(8px,env(safe-area-inset-left))}
.tb{position:relative;width:58px;height:50px;border:3px solid var(--ink);border-radius:9px;background:linear-gradient(#d8a873,#b57f4b);
  box-shadow:inset 0 3px 0 #ecc694,inset 0 -4px 0 #8a5a34,0 3px 0 rgba(0,0,0,.35);display:grid;place-items:center;padding:0}
.tb img{width:36px;height:36px}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tb .em{font-size:23px;line-height:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.tb .lb{font:700 8px var(--px);color:#3a2010;letter-spacing:.02em}
.jicon{font-size:17px;width:22px;text-align:center}
.tb:active{transform:translateY(2px);box-shadow:inset 0 3px 0 #ecc694,inset 0 -2px 0 #8a5a34}
.tb.on{background:linear-gradient(#f2cf8e,#d9a560)}
.tb:disabled{filter:grayscale(.8) brightness(.7);cursor:default}
.tb .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;border:2px solid var(--ink);font:700 11px/14px var(--px);padding:0 3px}

/* ---- panels ---- */
#panel{position:absolute;top:calc(env(safe-area-inset-top) + 44px);bottom:calc(env(safe-area-inset-bottom) + 64px);
  left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));max-width:900px;margin:0 auto;
  background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--paper-d),0 6px 0 rgba(0,0,0,.35);
  display:flex;flex-direction:column;overflow:hidden}
#panel[hidden]{display:none}
.ph{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;background:var(--wood);color:#fbe7b5;border-bottom:3px solid var(--ink)}
.ph h2{margin:0;font:700 17px var(--px);letter-spacing:.02em;flex:1}
.ph .sub{font-size:13px;opacity:.9}
.x{width:32px;height:30px;border:2px solid var(--ink);border-radius:6px;background:#e9c891;font:700 16px var(--px);padding:0}
.pb{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{border:2px solid var(--ink);border-radius:6px;background:var(--paper-d);padding:3px 10px;font-weight:700}
.tab.on{background:var(--gold)}
.muted{color:#7a5a3c}
.small{font-size:12.5px}
.btn{border:2px solid var(--ink);border-radius:6px;background:#e9c891;padding:3px 9px;font-weight:700;box-shadow:inset 0 -2px 0 #c39a5c;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.go{background:#8fd16a;box-shadow:inset 0 -2px 0 #5d9e3e}
.btn.bad{background:#f08b6b;box-shadow:inset 0 -2px 0 #c0563a}
.btn.gold{background:#ffd166;box-shadow:inset 0 -2px 0 #d1a03a}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.big{font-size:17px;padding:6px 14px}
.num{font-family:var(--px);font-weight:700}
.up{color:#2d7a1c}.dn{color:#b8322f}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.card{background:#fbf1d8;border:2px solid var(--ink);border-radius:8px;padding:6px 9px;margin-bottom:6px}
.card.hl{background:#fff6c9}
.bar{height:8px;border:2px solid var(--ink);border-radius:4px;background:#ddc79a;overflow:hidden;min-width:50px}
.bar i{display:block;height:100%}
table.mk{width:100%;border-collapse:collapse}
table.mk th{font:700 11px var(--px);text-align:left;color:#7a5a3c;padding:2px 4px;border-bottom:2px solid var(--paper-dd)}
table.mk td{padding:3px 4px;border-bottom:1px solid var(--paper-d);vertical-align:middle;white-space:nowrap}
table.mk td.r,table.mk th.r{text-align:right}
table.mk img{width:22px;height:22px;vertical-align:middle}
.tag{display:inline-block;font:700 10px var(--px);padding:1px 5px;border-radius:4px;border:1.5px solid var(--ink);margin-left:4px;vertical-align:middle}
.tag.p{background:#bfe3a5}.tag.w{background:#ffc98a}.tag.e{background:#ffd166}.tag.il{background:#d9a3e8}
.capline{display:flex;gap:14px;align-items:center;margin-bottom:6px;font-weight:700}

/* map */
.mapwrap{display:flex;gap:10px;height:100%}
.mapbox{position:relative;flex:1.4;min-height:180px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#cdb886}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.mapbox .lbl{position:absolute;transform:translate(-50%,7px);font:700 10px var(--body);background:rgba(244,228,193,.92);border:1.5px solid var(--ink);border-radius:4px;padding:0 4px;white-space:nowrap;pointer-events:none}
.mapbox .lbl[data-side=t]{transform:translate(-50%,calc(-100% - 7px))}
.mapbox .lbl[data-side=l]{transform:translate(calc(-100% - 7px),-50%)}
.mapbox .lbl[data-side=r]{transform:translate(7px,-50%)}
.mapbox .lbl[data-side=br]{transform:translate(4px,5px)}
.mapbox .lbl.far{opacity:.5}
.mapbox .lbl.here{background:#ffd166}
.mapbox .lbl.sel{background:#8fd16a}
.mapinfo{flex:1;overflow-y:auto;min-width:0}

/* modal (events, arrivals) */
#modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,12,10,.45);padding:12px}
#modal[hidden]{display:none}
.mb{width:min(460px,94vw);max-height:calc(100% - 10px);overflow-y:auto;background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px var(--paper-d),0 6px 0 rgba(0,0,0,.4)}
.mb h3{margin:0;padding:7px 12px;background:var(--wood);color:#fbe7b5;font:700 16px var(--px);border-bottom:3px solid var(--ink)}
.mb .t{padding:9px 12px 4px}
.mb .ch{display:flex;flex-direction:column;gap:6px;padding:6px 12px 12px}
.mb .ch .btn{text-align:left;font-size:15px;padding:6px 10px;white-space:normal}
.lines div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed var(--paper-dd)}

.hand{margin-top:2px}
.pc{display:inline-block;min-width:34px;padding:5px 4px;margin-right:4px;border:2px solid var(--ink);border-radius:6px;background:#fff;font:700 16px var(--px);text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pc.red{color:#b8322f}.pc.back{background:repeating-linear-gradient(45deg,#2f4a73 0 4px,#3f5a83 4px 8px);color:transparent}
.die{display:inline-grid;place-items:center;width:52px;height:52px;border:3px solid var(--ink);border-radius:10px;background:#fff;font:700 26px var(--px);box-shadow:0 3px 0 rgba(0,0,0,.3)}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 72px);display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
.toast{background:var(--paper);border:2px solid var(--ink);border-radius:7px;padding:3px 10px;font-weight:700;font-size:14px;animation:tin .25s ease-out}
.toast.g{background:#c9efb0}.toast.r{background:#ffc2ad}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

#rotate{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:#2a1a14;color:#fbe7b5;font:700 18px var(--px);padding:30px}
@media (orientation:portrait) and (max-width:700px){#rotate{display:grid}}
@media (max-height:500px){
  body{font-size:13px}
  #hud{gap:5px;padding-top:calc(env(safe-area-inset-top) + 4px)}
  .chip{border-width:2px;border-radius:7px;padding:2px 7px 3px;font-size:11px;gap:4px;box-shadow:inset 0 -2px 0 var(--paper-dd)}
  .chip img{width:13px;height:13px}
  #money{font-size:13px}
  #where{font-size:12px;gap:0}
  #where .rt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #where .prog{width:52px;height:8px;margin-left:6px;flex:none}
  #where .mi{margin-left:6px;font-size:11px;white-space:nowrap;flex:none}
  #pauseBtn{font-size:11px;padding:2px 8px 3px}
  #news{top:calc(env(safe-area-inset-top) + 34px);font-size:11px;padding:2px 8px}
  #bar{gap:5px;padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}
  .tb{width:48px;height:40px;border-width:2px;border-radius:8px}
  .tb img{width:28px;height:28px}
  .tb{width:62px}
  .tb .lb{letter-spacing:0}
  .tb .em{font-size:19px}
  .tb .lb{font-size:7px}
  .tb .dot{min-width:15px;height:15px;font-size:9px;line-height:12px;top:-5px;right:-5px}
  #panel{top:calc(env(safe-area-inset-top) + 34px);bottom:calc(env(safe-area-inset-bottom) + 50px);border-width:2px}
  .ph{padding:3px 6px 3px 10px;gap:8px;border-bottom-width:2px}
  .ph h2{font-size:13px}
  .ph .sub{font-size:11px}
  .x{width:26px;height:24px;font-size:13px}
  .pb{padding:6px 8px}
  .btn{padding:2px 7px;font-size:12px}
  .big{font-size:14px;padding:4px 10px}
  .card{padding:4px 7px;margin-bottom:4px;border-radius:6px}
  .small{font-size:11px}
  .tab{padding:2px 8px;font-size:12px}
  .tag{font-size:8px;padding:0 4px}
  .capline{gap:10px;margin-bottom:4px;font-size:12px}
  table.mk th{font-size:9px}
  table.mk td{padding:2px 3px}
  table.mk img{width:17px;height:17px}
  h3{font-size:14px}
  .mb h3{font-size:13px;padding:5px 10px}
  .mb .t{padding:7px 10px 3px}
  .mb .ch{gap:4px;padding:5px 10px 9px}
  .mb .ch .btn{font-size:13px;padding:4px 8px}
  .pc{min-width:28px;padding:3px;font-size:13px}
  .die{width:42px;height:42px;font-size:21px}
  .toast{font-size:12px;padding:2px 8px}
  #toasts{top:calc(env(safe-area-inset-top) + 56px)}
  .mapbox .lbl{font-size:9px}
}
@media (max-height:340px){.tb{width:52px;height:44px}.tb img{width:32px;height:32px}#panel{bottom:calc(env(safe-area-inset-bottom) + 56px)}}
</style>

<div id="game">
  <canvas id="scene"></canvas>
  <div id="hud">
    <div class="chip" id="moneyChip"><img class="px" id="coinImg" alt=""><span id="money">$0</span></div>
    <div class="chip" id="where"></div>
    <div class="chip" id="fuelChip"></div>
    <div class="chip" id="dayChip"></div>
    <button class="chip" id="pauseBtn" aria-label="Pause" hidden>❚❚</button>
  </div>
  <div id="news"></div>
  <div id="pausedBanner" hidden>PAUSED<small>Tap ▶ to roll on</small></div>
  <div id="panel" hidden></div>
  <div id="bar"></div>
  <div id="toasts"></div>
  <div id="modal" hidden></div>
  <div id="rotate">Turn your phone sideways<br>to ride the rails</div>
</div>

<script>
(function(){
'use strict';
// =====================================================================================
//  small helpers
// =====================================================================================
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = Math.random;
const rf = (a, b) => a + R() * (b - a);
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = a => a[Math.floor(R() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

// =====================================================================================
//  world data
// =====================================================================================
const GOODS = [
  { id:'coal',    n:'Coal',         base:12,  col:'#2e2e33', hi:'#5c5c66' },
  { id:'grain',   n:'Grain',        base:16,  col:'#e3bd4f', hi:'#f6dd8a' },
  { id:'oranges', n:'Oranges',      base:24,  col:'#f08a24', hi:'#ffc06a' },
  { id:'lumber',  n:'Lumber',       base:20,  col:'#9b6a3c', hi:'#c99560' },
  { id:'iron',    n:'Iron',         base:34,  col:'#7d8794', hi:'#b9c2cc' },
  { id:'cotton',  n:'Cotton',       base:28,  col:'#f2efe6', hi:'#ffffff' },

const TOWN = Object.fromEntries(TOWNS.map(t => [t.id, t]));
// every city links to the cities near it, and no two lines of track cross
const EDGES = [['seat','denv'],['seat','minn'],['sanf','seat'],['jack','sava'],['nyc','bost'],['sava','atla'],['pitt','detr'],['atla','char'],['atla','nash'],
  ['sava','char'],['nash','cinc'],['cinc','pitt'],['cinc','detr'],['phoe','vega'],['jack','atla'],['phoe','albu'],['pitt','nyc'],['nash','char'],['cinc','char'],
  ['denv','albu'],['vega','sanf'],['pitt','char'],['vega','albu'],['minn','kans'],['nash','kans'],['nyc','detr'],['kans','fort'],['fort','albu'],['cinc','kans'],
  ['denv','kans'],['nyc','char'],['detr','minn'],['denv','vega']];
const ADJ = {}; TOWNS.forEach(t => ADJ[t.id] = []);
const dist = (a, b) => Math.hypot(TOWN[a].x - TOWN[b].x, TOWN[a].y - TOWN[b].y);
EDGES.forEach(([a, b]) => { const d = dist(a, b); ADJ[a].push([b, d]); ADJ[b].push([a, d]); });
function route(from, to){                                  // dijkstra over the rail graph
  const D = {}, P = {}, Q = new Set(TOWNS.map(t => t.id));
  TOWNS.forEach(t => D[t.id] = Infinity); D[from] = 0;
  while (Q.size){
    let u = null; for (const q of Q) if (u === null || D[q] < D[u]) u = q;
    Q.delete(u); if (u === to) break;
    for (const [v, w] of ADJ[u]) if (D[u] + w < D[v]) { D[v] = D[u] + w; P[v] = u; }
  }
  const path = [to]; while (path[0] !== from) path.unshift(P[path[0]]);
  return { path, d:D[to] };
}
const SEG_LEN = 6;                                          // map units per segment (segments are only the event checkpoints now)
const LATLON = t => [49.5 - TOWN[t].y * 25 / 62, TOWN[t].x * 59 / 100 - 125];
function legMiles(a, b){
  const [la1, lo1] = LATLON(a), [la2, lo2] = LATLON(b), r = Math.PI / 180;
  const h = Math.sin((la2 - la1) * r / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin((lo2 - lo1) * r / 2) ** 2;
  return Math.round(3959 * 2 * Math.asin(Math.sqrt(h)) * 1.15 / 5) * 5;
}
const pathMiles = path => path.slice(1).reduce((s, t, i) => s + legMiles(path[i], t), 0);
const fmtMi = m => Math.round(m).toLocaleString('en-US') + ' mi';
const segsFor = d => Math.max(2, Math.round(d / SEG_LEN));

const LOCOS = [

const BIZ = {   // investment kinds; a town gets the ones that fit what it makes

const SAVE_KEY = 'pixelrails.v3';
let G = null;

function newGame(){
  const seed = Math.floor(Math.random() * 1e9);
  R = mulberry(seed);
  G = { v:4, seed, money:600, day:1 + 8 / 24, weather:{ k:'clear', until:0 }, town:START, trip:null, cargo:{}, paid:{}, pax:[], contracts:[],
    train:{ loco:0, cars:['freight','coach'], cond:100 }, crew:[], loan:0, shares:{}, events:[], news:[], mk:{}, offers:{},
    seen:{}, biz:{}, wageDays:0, fuel:12, wall:Date.now(), stats:{ trips:0, earned:0, best:0 }, cid:1, nextNewsDay:2 };
  // markets: every world rolls its own prices, so nobody knows the best route ahead of time
  for (const t of TOWNS){
    const m = {}; G.mk[t.id] = m;
    for (const g of GOODS) m[g.id] = { mult:rf(.85, 1.2), drift:0, press:0 };
    for (const g of t.prod) m[g].mult = rf(.5, .8);
    const others = shuffle(GOODS.map(g => g.id).filter(g => !t.prod.includes(g)));
    others.slice(0, ri(3, 4)).forEach(g => m[g].mult = rf(1.3, 2.5));
    m.moon = { mult: t.shady ? .45 : rf(1.9, 2.8), drift:0, press:0 };
    // investments
    G.biz[t.id] = t.prod.map((g, i) => {
      const price = Math.round(rf(250, 520) * (GOOD[g].base / 30 + 1) / 10) * 10;
      return { id:t.id + i, n:BIZ[g], price, rate:rf(.07, .13), owned:0 };
    });
  }
  TOWNS.forEach(t => refreshOffers(t.id, true));
  R = Math.random;
  G.news.unshift({ day:1, txt:'Welcome to the rails! Buy low where goods are made, sell high where they are wanted.' });
  noteSeen(START);
}

function save(){ if (!G) return; G.wall = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
function load(){ try { const s = localStorage.getItem(SAVE_KEY); if (s) { const g = JSON.parse(s); if (g && (g.v === 3 || g.v === 4)){
      g.crew = [];
      if (g.fuel == null){ g.fuel = LOCOS[g.train.loco].tank; delete g.freeCoal; if (g.trip && g.trip.fuel == null) g.trip.fuel = 0; }
      if (g.v === 3){ g.v = 4; delete g.tod; if (g.trip){ const T = g.trip; T.path = [T.path[0], T.path[1]]; T.to = T.path[1]; T.miles = legMiles(T.from, T.to); T.hours = T.miles / LOCOS[g.train.loco].mph; T.secs = T.hours * SEC_PER_HOUR; T.seg = Math.min(T.seg, T.segs - 1); } }
      if (g.train.cars.includes('casino')){ const n = g.train.cars.filter(c => c === 'casino').length; g.train.cars = g.train.cars.filter(c => c !== 'casino'); g.money += n * 1400; }
      g.train.cars.sort((a, b) => ['tender', 'luxury', 'coach', 'dining', 'casino', 'freight', 'smug'].indexOf(a) - ['tender', 'luxury', 'coach', 'dining', 'casino', 'freight', 'smug'].indexOf(b));
      return g; } } } catch (e) {} return null; }

// ---- prices ----
function price(town, g){
  const m = G.mk[town][g]; let p = GOOD[g].base * m.mult * (1 + m.drift) * (1 - m.press);
  for (const e of G.events) if (e.town === town && e.good === g) p *= e.f;
  return Math.max(1, p);
}
const buyP  = (t, g) => Math.max(1, Math.ceil(price(t, g) * 1.05));
const sellP = (t, g) => Math.max(1, Math.floor(price(t, g) * .95));
function noteSeen(t){ const p = {}; for (const g of GOODS) p[g.id] = [buyP(t, g.id), sellP(t, g.id)]; G.seen[t] = { day:Math.floor(G.day), p }; }

// ---- train numbers ----
const loco = () => LOCOS[G.train.loco];
const CAR_ORDER = ['tender', 'luxury', 'coach', 'dining', 'casino', 'freight', 'smug'];
const sortCars = () => G.train.cars.sort((a, b) => CAR_ORDER.indexOf(a) - CAR_ORDER.indexOf(b));   // luxury rides up front so its passengers stay on screen
const capOf = () => G.train.cars.reduce((s, c) => s + (c === 'freight' ? CARS.freight.cap : 0), 0);
const hideCap = () => G.train.cars.filter(c => c === 'smug').length * CARS.smug.cap;
const seatsOf = () => G.train.cars.filter(c => c === 'coach').length * CARS.coach.seats;
const richOf = () => G.train.cars.filter(c => c === 'luxury').length * CARS.luxury.rich;
const cargoUsed = () => Object.entries(G.cargo).reduce((s, [g, q]) => s + (g === 'moon' ? 0 : q), 0);
const moonUsed = () => G.cargo.moon || 0;
const paxUsed = cls => G.pax.filter(p => p.cls === cls).reduce((s, p) => s + p.n, 0);
const has = c => G.train.cars.includes(c);
function crew(role){ return G.crew.find(c => c.role === role); }
// a passenger's fare: $12 plus 10.5 cents a mile along the track; rich travelers pay about 3x
function paxFare(from, to, rich){ const mi = pathMiles(route(from, to).path); return Math.round((12 + mi * .105) * (rich ? rf(2.6, 3.3) : rf(.9, 1.15))); }
const seatsFree = cls => (cls === 'rich' ? richOf() : seatsOf()) - paxUsed(cls);
function skill(role){ return 0;   // crew removed (user)
}
function oldSkill(role){                                       // mood changes how hard they work
  const c = crew(role); if (!c) return 0;
  return clamp(c.skill + (c.mood >= 75 ? 1 : 0) - (c.mood < 40 ? 1 : 0) - (c.mood < 20 ? 1 : 0), 0, 6);
}
const coalPrice = () => 11;
const SEC_PER_HOUR = 10;
const mphNow = () => loco().mph * (1 + .07 * skill('engineer')) * (G.train.cond < 50 ? .8 : 1);
const segTime = () => G.trip ? G.trip.secs / G.trip.segs : 6;          // real seconds between event checkpoints
const hourOfDay = () => (G.day % 1) * 24;
const todNow = () => ((hourOfDay() - 6) / 24 + 1) % 1;                   // 0 = 6 AM, .25 noon, .5 6 PM, .75 midnight
function clockText(){ const mins = Math.floor(hourOfDay() * 60 + 1e-3), H = Math.floor(mins / 60) % 24, m = Math.floor(mins % 60 / 10) * 10; return `${(H + 11) % 12 + 1}:${String(m).padStart(2, '0')} ${H < 12 ? 'AM' : 'PM'}`; }
const isNeighbor = (a, b) => ADJ[a].some(([t]) => t === b);
const burnPer100 = () => loco().coal * (1 - .06 * skill('engineer'));                 // tons of engine coal per 100 miles
const fuelCap = () => loco().tank + G.train.cars.filter(c => c === 'tender').length * CARS.tender.fuel;
const fuelPrice = t => Math.max(2, Math.round(price(t, 'coal') * .4));                 // engine-grade coal: 40% of the town's coal price, so coal towns are the cheap fill-ups
function netWorth(){
  let v = G.money - G.loan;
  for (const t in G.biz) for (const b of G.biz[t]) v += b.owned * b.price * .7;
  v += LOCOS[G.train.loco].price * .5 + G.train.cars.reduce((s, c) => s + CARS[c].price * .5, 0);
  return v;
}

// ---- offers at stations: passengers, contracts, crew for hire ----
function refreshOffers(tid, full){
  const t = TOWN[tid], o = G.offers[tid] || (G.offers[tid] = { pax:[], con:[], hire:[] });
  const others = TOWNS.filter(x => x.id !== tid);
  // passengers
  o.pax = o.pax.filter(() => !full && R() < .5);
  const nPax = ri(2, 3 + t.size) - o.pax.length;
  for (let i = 0; i < nPax; i++){
    const to = pick(others).id, d = route(tid, to).d, rich = R() < .22 + .06 * t.size;
    o.pax.push({ id:G.cid++, to, cls:rich ? 'rich' : 'std', n:rich ? ri(2, 8) : ri(5, 20), fare:paxFare(tid, to, rich) });
  }
  // contracts
  o.con = o.con.filter(c => !full && R() < .6 && spareDays(c) >= 0);          // drop jobs you can no longer make in time
  while (o.con.length < 1 + Math.min(2, t.size)){
    const to = pick(others).id, g = pick(GOODS), qty = Math.min(ri(4, 14) - (g.base > 100 ? 2 : 0), Math.max(4, capOf())), d = route(tid, to).d;   // never more than your freight cars hold
    // pay = the goods back (+15%) plus a haul fee per crate that, like a fare, grows with every mile (a bit above a seat,
    // since you front the money and race a deadline). the tighter the deadline for YOUR engine, the bigger the bonus
    const mi = pathMiles(route(tid, to).path), slack = pick([0, 1, 1, 2, 2, 3, 3, 4]);
    const due = Math.floor(G.day) + Math.ceil(mi / mphNow() / 24) + slack;
    const rush = [1.8, 1.5, 1.3, 1.15, 1.0][slack];
    const pay = Math.round((qty * g.base * 1.15 + qty * (10 + mi * .12) * rush * rf(.92, 1.08)) / 5) * 5;
    o.con.push({ id:G.cid++, from:tid, to, good:g.id, qty, due, pay, slack, fine:Math.round(pay * (slack ? .35 : .5) / 5) * 5 });
  }
  // crew for hire
  o.hire = o.hire.filter(() => !full && R() < .5);
  while (o.hire.length < 1 + (t.size > 1 ? 1 : 0) + (R() < .4 ? 1 : 0)){
    const role = pick(Object.keys(ROLES)), sk = clamp(ri(1, 3) + (R() < .2 ? 1 : 0) + (t.size === 3 && R() < .3 ? 1 : 0), 1, 5);
    o.hire.push({ id:G.cid++, role, name:pick(FIRST) + ' ' + pick(LAST), skill:sk, wage:sk * 9 + ri(4, 10), mood:ri(60, 80), look:ri(0, 9999) });
  }
}

// days you could lose and still deliver on time, from where the job is posted, with your engine
function spareDays(c){ return c.due - Math.floor(G.day) - Math.ceil(pathMiles(route(c.from, c.to).path) / mphNow() / 24); }

// ---- days pass only while the train is moving ----
const NEWS = [

  { t:'Sheriff cracks down in {T}: moonshine runners beware.', fx:[['moon',.6]], law:1 },
];
function newsEvent(){
  const n = pick(NEWS), t = pick(TOWNS), dur = ri(3, 6);
  for (const [g, f] of n.fx) G.events.push({ town:t.id, good:g, f, until:G.day + dur });
  const txt = n.t.replace('{T}', t.n);
  G.news.unshift({ day:Math.floor(G.day), txt }); G.news.length = Math.min(G.news.length, 25);
  showNews(txt);
}
function dayTick(){
  // prices wander, sold-out markets recover
  for (const t in G.mk) for (const g in G.mk[t]){
    const m = G.mk[t][g];
    m.press *= .62;
    m.drift = clamp(m.drift * .8 + (Math.random() - .5) * .14, -.3, .3);
  }
  G.events = G.events.filter(e => e.until > G.day);
  if (G.day >= G.nextNewsDay){ newsEvent(); G.nextNewsDay = G.day + ri(1, 3); }
  // loan interest
  if (G.loan > 0){ const i = Math.ceil(G.loan * .025); G.loan += i; }
  // crew get restless on the road; a cook keeps spirits up
  for (const c of G.crew) c.mood = clamp(c.mood - (has('dining') ? 1 : 3) + (skill('cook') ? 1 : 0), 0, 100);
  // contracts past due
  for (const c of G.contracts.slice()) if (Math.floor(G.day) > c.due){
    G.contracts.splice(G.contracts.indexOf(c), 1); G.money -= c.fine;
    toast(`Contract failed: ${GOOD[c.good].n} to ${TOWN[c.to].n}. Fined ${fmt(c.fine)}`, 'r');
  }
  TOWNS.forEach(t => refreshOffers(t.id, false));
}
function advanceDay(amount){
  const before = Math.floor(G.day);
  G.day += amount; G.wageDays += amount;
  for (let d = before + 1; d <= Math.floor(G.day); d++) dayTick();
}

// ---- investments pay in real time, even while the app is closed (capped at 8 hours) ----
function incomePerHour(){ let s = 0; for (const t in G.biz) for (const b of G.biz[t]) s += b.owned * b.price * b.rate; return s; }
let incomeAcc = 0;
function accrue(sec){
  const v = incomePerHour() * sec / 3600; if (!v) return 0;
  incomeAcc += v;
  if (incomeAcc >= 1){ const w = Math.floor(incomeAcc); incomeAcc -= w; G.money += w; G.stats.earned += w; }
  return v;
}

function tripPreview(to){
  const path = [G.town, to], miles = legMiles(G.town, to), mph = mphNow(), hours = miles / mph;
  const segs = Math.max(2, Math.round(hours / 4));                          // a chance of a road event about every 4 hours
  return { path, segs, miles, mph, hours, secs:hours * SEC_PER_HOUR, fuel:Math.round(miles / 100 * burnPer100() * 10) / 10 };
}
const hoursText = h => h < 1 ? Math.round(h * 60) + ' min' : (Math.round(h * 2) / 2) + ' hr';
const realText = s => s < 60 ? Math.round(s) + 's' : Math.floor(s / 60) + 'm ' + String(Math.round(s % 60)).padStart(2, '0') + 's';
function depart(to){
  if (!isNeighbor(G.town, to)){ toast('No direct track. Go to a connecting city first.', 'r'); return; }
  const p = tripPreview(to);
  if (p.fuel > fuelCap()){ toast(`Too far for your tank (needs ${p.fuel.toFixed(1)} t). Add a coal tender or a bigger engine.`, 'r'); return; }
  if (G.fuel + 1e-6 < p.fuel){ toast(`Not enough coal: need ${p.fuel.toFixed(1)} t, you have ${G.fuel.toFixed(1)} t.`, 'r'); return; }
  closePanel();
  // biome for each segment: first half looks like where you left, second half like where you are going
  const legs = [];
  for (let i = 0; i < p.segs; i++){
    const f = (i + .5) / p.segs * (p.path.length - 1), k = Math.min(p.path.length - 2, Math.floor(f));
    legs.push(TOWN[f - k < .5 ? p.path[k] : p.path[k + 1]].biome);
  }
  G.trip = { from:G.town, to, path:p.path, segs:p.segs, miles:p.miles, secs:p.secs, hours:p.hours, fuel:p.fuel, board:[], boardT:0, reserved:null, seg:0, el:0, legs, log:[], tips:0, sick:false };
  for (let i = 0; i < 3; i++) G.trip.board.push(makeGroup(to));
  G.town = null; G.stats.trips++;
  V.depart();
  save(); refreshHud();
}
// reverse the trip: from and to swap, and the new distance is how far you've already come
function turnBack(){
  const T = G.trip; if (!T || V.decel) return;
  const back = T.miles * Math.min(1, (T.seg + T.el / segTime()) / T.segs), mph = mphNow(), hours = back / mph, need = back / 100 * burnPer100();
  if (back < 1) return;
  if (G.fuel + 1e-6 < need){ toast('Not enough coal to make it back!', 'r'); return; }
  const segs = Math.max(1, Math.round(hours / 4));
  Object.assign(T, { from:T.to, to:T.from, path:[T.to, T.from], miles:back, hours, secs:hours * SEC_PER_HOUR, segs, seg:0, el:0, fuel:need, board:[], boardT:0, reserved:null });
  for (let i = 0; i < 3; i++) T.board.push(makeGroup(T.to));
  V.req = null;
  closePanel(); toast(`Turning back to ${TOWN[T.to].n}: ${fmtMi(back)}`, 'g'); save(); refreshHud();
}
function segmentDone(){
  const T = G.trip;
  G.train.cond = clamp(G.train.cond - rf(.7, 1.8), 0, 100);
  if (skill('cook') && G.pax.length){ const tip = Math.round((paxUsed('std') + paxUsed('rich') * 2) * .6 * skill('cook')); if (tip){ G.money += tip; T.tips += tip; } }
  T.seg++; T.el = 0;
  if (T.seg >= T.segs) return arrive();
  // random events on the road
  if (!V.decel && Math.random() < .3 + (G.train.cond < 40 ? .1 : 0)) roadEvent();
  save(); rerender();
}
function arrive(){
  const T = G.trip, to = T.to, t = TOWN[to], lines = [];
  lines.push([`${fmtMi(T.miles)} in ${hoursText(T.hours || T.secs / SEC_PER_HOUR)}`, 0]);
  if (T.burned) lines.push([`Burned ${T.burned.toFixed(1)} t of coal (${G.fuel.toFixed(1)} t left)`, 0]);
  lines.push(...T.log);
  G.trip = null; G.town = to; G.paused = false;
  // fares
  let fares = 0;
  const mult = (1 + .06 * skill('conductor')) * (has('dining') ? 1.15 : 1) * (T.sick ? .8 : 1);
  for (const p of G.pax.slice()) if (p.to === to){ fares += Math.round(p.fare * p.n * mult); G.pax.splice(G.pax.indexOf(p), 1); }
  // the group you reserved is waiting on the platform
  if (T.reserved){ const r = T.reserved; delete r.life; delete r.max;
    const free = r.cls === 'rich' ? richOf() - paxUsed('rich') : seatsOf() - paxUsed('std');
    const k = Math.min(r.n, Math.max(0, free));
    if (k > 0) G.pax.push({ ...r, n:k }); if (k < r.n) G.offers[to].pax.unshift({ ...r, id:G.cid++, n:r.n - k });
    lines.push([k ? `Your reservation boarded: ${k} to ${TOWN[r.to].n}` : 'Your reserved group is waiting (no seats)', 0]); }
  if (fares) lines.push(['Passenger fares', fares]);
  if (T.tips) lines.push(['Tips (cook)', 0, T.tips]);
  // contracts
  for (const c of G.contracts.slice()) if (c.to === to && (G.cargo[c.good] || 0) >= c.qty){
    G.cargo[c.good] -= c.qty; if (!G.cargo[c.good]) delete G.cargo[c.good];
    G.contracts.splice(G.contracts.indexOf(c), 1); lines.push([`Contract: ${c.qty} ${GOOD[c.good].n}`, c.pay]); fares += c.pay;
  }
  // wages for the days on the road
  let wages = 0;
  if (G.crew.length){
    const owed = Math.round(G.crew.reduce((s, c) => s + c.wage, 0) * G.wageDays);
    if (G.money + fares >= owed){ wages = owed; G.crew.forEach(c => c.mood = clamp(c.mood + 4, 0, 100)); }
    else { wages = Math.max(0, Math.floor(G.money + fares)); G.crew.forEach(c => c.mood = clamp(c.mood - 25, 0, 100)); lines.push(['Could not pay crew in full!', 0]); }
    lines.push(['Crew wages', -wages]);
  }
  G.wageDays = 0;
  const fee = 6 + t.size * 6; lines.push(['Station fee', -fee]);
  G.money += fares - wages - fee; G.stats.earned += fares;
  // unhappy crew misbehave
  for (const c of G.crew.slice()){
    if (c.mood < 25 && Math.random() < .35){ G.crew.splice(G.crew.indexOf(c), 1); lines.push([`${c.name} (${ROLES[c.role].n}) quit in a huff`, 0]); }
    else if (c.mood < 30 && Math.random() < .25 && G.money > 50){ const s = Math.round(G.money * rf(.02, .05)); G.money -= s; lines.push([`Cash missing... ${c.name} looks guilty`, -s]); }
  }
  noteSeen(to);
  G.stats.best = Math.max(G.stats.best, G.money);
  V.arrive(to);
  const inspect = moonUsed() > 0 && Math.random() < t.law * (has('smug') ? .5 : 1) * (1 - .1 * skill('guard'));
  showArrival(t, lines, fares, inspect);
  save(); refreshHud(); rerender();
}

function mk(w, h, fn){ const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); fn && fn(g); return c; }
function P(g, col, x, y, w = 1, h = 1){ g.fillStyle = col; g.fillRect(x, y, w, h); }
function disc(g, cx, cy, r, col){ g.fillStyle = col; for (let y = -r; y <= r; y++){ const w = Math.floor(Math.sqrt(r * r - y * y + r * .6)); g.fillRect(cx - w, cy + y, w * 2 + 1, 1); } }
function outlined(src, col = '#24150f'){

    for (const [dx, dy] of [[0,1],[2,1],[1,0],[1,2]]) g.drawImage(s, dx, dy);

}

function shade(hex, a){

}

  hay(r){ return outlined(mk(7, 6, h => { disc(h, 3, 3, 3, '#d9b04a'); P(h, '#b88a2a', 1, 3, 5, 1); P(h, '#f2d07a', 2, 1, 2, 1); }), OUT); },
  derrick(r){ return outlined(mk(11, 24, h => { for (let y = 2; y < 24; y++){ const s = Math.floor(y / 5); P(h, '#2a2a2e', 5 - s, y, 1, 1); P(h, '#2a2a2e', 5 + s, y, 1, 1); if (y % 5 === 0) P(h, '#2a2a2e', 5 - s, y, s * 2 + 1, 1); } P(h, '#2a2a2e', 4, 0, 3, 2); P(h, '#5a4a3a', 0, 22, 11, 2); }), OUT); },
  pumpjack(r){ return outlined(mk(16, 10, h => { P(h, '#2a2a2e', 7, 3, 2, 6); P(h, '#3a3a40', 1, 2, 14, 2); P(h, '#3a3a40', 0, 1, 3, 4); P(h, '#5a4a3a', 0, 9, 16, 1); P(h, '#b8322f', 12, 6, 3, 3); }), OUT); },
  factory(r){ const w = 24 + Math.floor(r() * 10); return outlined(mk(w, 26, h => { P(h, '#8a4a3a', 0, 12, w, 14); P(h, '#a85a44', 0, 12, w, 1); for (let x = 0; x < w; x += 6){ P(h, '#6a3a2e', x, 9, 6, 3); P(h, '#7a4a3a', x, 9, 3, 1); } for (let x = 2; x < w - 2; x += 4) P(h, '#ffd27a', x, 16, 2, 3);
    P(h, '#5a4a44', 3, 0, 3, 12); P(h, '#5a4a44', w - 8, 2, 3, 10); P(h, '#b8322f', 3, 1, 3, 1); P(h, '#b8322f', w - 8, 3, 3, 1); }), OUT); },
  tower(r, tall = 1){

  skyscraper(r){ return PROP.tower(r, 1.5); },
  brick(r){ const w = 12 + Math.floor(r() * 6), hh = 12 + Math.floor(r() * 8); return outlined(mk(w, hh + 3, h => { P(h, '#a8523e', 0, 3, w, hh); P(h, '#c06a52', 0, 3, w, 1); P(h, '#5a3a2a', 0, 2, w, 2); P(h, '#7a4a3a', w - 4, 0, 2, 3);

  lighthouse(r){ return outlined(mk(9, 28, h => { for (let y = 8; y < 28; y++){ const w = 3 + Math.floor((y - 8) / 6); P(h, Math.floor((y - 8) / 4) % 2 ? '#b8322f' : '#f2efe6', 4 - (w >> 1), y, w, 1); } P(h, '#2a2a2e', 2, 6, 5, 2); P(h, '#ffe680', 3, 3, 3, 3); P(h, '#2a2a2e', 3, 1, 3, 2); P(h, '#2a2a2e', 1, 6, 7, 1); }), OUT); },
  umbrella(r){ const C = ['#e24b3b', '#2f6fb0', '#e8b23a', '#3f8a3e'][Math.floor(r() * 4)]; return outlined(mk(13, 12, h => { P(h, '#6a4a2a', 6, 3, 1, 9); P(h, C, 1, 2, 11, 2); P(h, C, 3, 1, 7, 1); P(h, '#f2efe6', 4, 2, 2, 2); P(h, '#f2efe6', 8, 2, 2, 2); P(h, '#e8d5a8', 2, 11, 9, 1); }), OUT); },
  liveoak(r){ return outlined(mk(26, 15, h => { P(h, '#4a3a2a', 12, 6, 3, 9); P(h, '#4a3a2a', 7, 7, 6, 1); P(h, '#4a3a2a', 15, 6, 5, 1);

  longleaf(r){ const hh = 20 + Math.floor(r() * 8); return outlined(mk(9, hh, h => { P(h, '#6a4a2a', 4, 5, 1, hh - 5); disc(h, 4, 3, 3, '#3f6a3a'); P(h, '#5a8a4a', 2, 1, 3, 1); P(h, '#3f6a3a', 0, 4, 2, 1); P(h, '#3f6a3a', 7, 3, 2, 1); }), OUT); },

  house(r){ const C = ['#e8d5a8', '#c9d6e6', '#e6c8b8', '#d8e6c8'][Math.floor(r() * 4)]; return outlined(mk(14, 12, h => { P(h, C, 1, 5, 12, 7); P(h, '#7a3a2a', 0, 3, 14, 3); P(h, '#7a3a2a', 3, 1, 8, 2); P(h, '#5a3a22', 6, 8, 2, 4); P(h, '#9fd3e8', 2, 7, 2, 2); P(h, '#9fd3e8', 10, 7, 2, 2); }), OUT); },
  reeds(r){ return outlined(mk(7, 7, h => { for (let i = 0; i < 4; i++){ P(h, '#7a8a4a', 1 + i * 2, 2 + (i % 2), 1, 5); P(h, '#5a4a2a', 1 + i * 2, 1 + (i % 2), 1, 2); } }), OUT); },
  sailboat(r){ return outlined(mk(12, 12, h => { P(h, '#7a4a2a', 1, 9, 10, 2); P(h, '#5a3a22', 2, 11, 8, 1); P(h, '#4a3a2a', 6, 1, 1, 8); P(h, '#f2efe6', 2, 2, 4, 6); P(h, '#f2efe6', 7, 3, 3, 5); }), OUT); },

// where along the real map you are decides what the land looks like between cities
function regionBiome(lat, lon){
  if (lon < -121) return lat > 42 ? 'rainforest' : 'baycliffs';
  if (lon < -117.5) return lat > 35.5 ? 'rockies' : 'mojave';          // Cascades / Sierra Nevada
  if (lon < -112.5) return lat > 41 ? 'mojave' : lat < 34.3 ? 'saguaro' : 'mojave';
  if (lon < -104.8) return lat >= 38 ? 'rockies' : 'mesa';
  if (lon < -97) return lat < 34.5 ? 'scrub' : lat > 44.5 ? 'northwoods' : 'prairie';
  if (lon < -93) return lat > 44 ? 'northwoods' : lat < 34.5 ? 'pines' : 'prairie';
  if (lon < -85) return lat > 41.5 ? 'greatlakes' : lat < 35 ? 'pines' : 'farmland';
  if (lon < -80.5) return lat > 41.2 ? 'greatlakes' : lat > 38.5 ? 'farmland' : lat > 34.8 ? 'hills' : lat < 31.5 ? 'lowcountry' : 'pines';
  if (lon < -76) return lat > 39.5 ? 'hills' : lat > 34 ? 'pines' : 'lowcountry';
  return lat > 42 ? 'harbor' : 'hills';
}
// scenery at the train's spot on a trip: the city you left, the land in between, then the city ahead
function sceneryAt(T){
  const f = Math.min(1, (T.seg + T.el / segTime()) / T.segs);
  if (f < .12) return TOWN[T.from].biome;
  if (f > .88) return TOWN[T.to].biome;
  const q = Math.round(f * 20) / 20, [a1, o1] = LATLON(T.from), [a2, o2] = LATLON(T.to);
  return regionBiome(lerp(a1, a2, q), lerp(o1, o2, q));
}

const STRIP_W = 640;
let strips = {};
function hash(n){ n = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); n ^= n >>> 16; return (n >>> 0) / 4294967296; }   // integer-safe, so big inputs stay random
function makeStrips(biome, H, horizon){
  const B = BIOMES[biome], r = mulberry([...biome].reduce((s, c) => s * 31 + c.charCodeAt(0), 7));
  const wrap = (g, img, x, y) => { g.drawImage(img, x, y); if (x + img.width > STRIP_W) g.drawImage(img, x - STRIP_W, y); };
  // ---- far: mountains, mesas, distant skyline, blue ridges ----
  const far = mk(STRIP_W, H, g => {
    const F = B.far;
    if (F.t === 'peaks' || F.t === 'volcano'){
      const list = F.t === 'volcano' ? [[STRIP_W * .3, 74, 120], [STRIP_W * .72, 34, 60], [STRIP_W * .05, 30, 55], [STRIP_W * .9, 28, 50]]
        : Array.from({ length:7 }, (_, i) => [i * STRIP_W / 7 + r() * 40, (F.big ? 58 : 40) + r() * (F.big ? 34 : 24), 55 + r() * 45]);
      for (const [cx, h, w] of list) for (let dx = -w; dx <= w; dx++){
        const top = Math.round(horizon - h * (1 - Math.abs(dx) / w) - (hash(Math.round(cx) + dx) > .75 ? 1 : 0)), col = dx < 0 ? F.c[0] : F.c[1];
        for (const X of [cx + dx, cx + dx - STRIP_W, cx + dx + STRIP_W]){ const x = Math.round(X); if (x < 0 || x >= STRIP_W) continue;
          P(g, col, x, top, 1, horizon - top);
          if (F.cap && horizon - top > h * .55) P(g, dx < 0 ? F.cap : shade(F.cap, -.14), x, top, 1, Math.max(2, Math.round(horizon - top - h * .55) + (hash(x) > .6 ? 2 : 0))); }
      }
    } else if (F.t === 'mesas'){
      for (let i = 0; i < 5; i++){ const cx = i * STRIP_W / 5 + r() * 50, w = 30 + r() * 50, h = 22 + r() * 22;
        for (let dx = -w; dx <= w; dx++){ const e = Math.abs(dx) / w, top = Math.round(horizon - h * (e < .7 ? 1 : (1 - e) / .3));
          for (const X of [cx + dx, cx + dx - STRIP_W]){ const x = Math.round(X); if (x < 0 || x >= STRIP_W) continue;
            P(g, dx < 0 ? F.c[0] : F.c[1], x, top, 1, horizon - top); P(g, shade(F.c[1], -.18), x, top + 5, 1, 2); P(g, shade(F.c[0], .15), x, top + 11, 1, 2); P(g, shade(F.c[1], -.1), x, top + 17, 1, 2); } } }
    } else if (F.t === 'ranges'){
      for (let x = 0; x < STRIP_W; x++){ const t = x / STRIP_W * Math.PI * 2, y = Math.round(horizon - 16 - 8 * Math.sin(t * 4 + 1) - 5 * Math.sin(t * 9 + 2) - 3 * Math.sin(t * 17));
        P(g, (x % 80) < 40 ? F.c[0] : F.c[1], x, y, 1, horizon - y); P(g, shade(F.c[0], .15), x, y, 1, 1); }
    } else if (F.t === 'bluehills'){
      F.c.forEach((c, k) => { for (let x = 0; x < STRIP_W; x++){ const t = x / STRIP_W * Math.PI * 2, y = Math.round(horizon - 30 + k * 9 - 6 * Math.sin(t * (2 + k) + k) - 3 * Math.sin(t * (7 + k)));
        P(g, c, x, y, 1, horizon - y); } });
    } else if (F.t === 'skyline'){
      let x = 0; while (x < STRIP_W){ const w = 8 + Math.floor(r() * 12), h = (F.tall ? 30 : 18) + Math.floor(r() * (F.tall ? 50 : 26));
        P(g, F.c, x, horizon - h, w, h); P(g, shade(F.c, .12), x, horizon - h, 1, h); if (r() < .3) P(g, F.c, x + (w >> 1), horizon - h - 6, 1, 6); x += w + Math.floor(r() * 3); }
    }
  });
  // ---- mid: hills, sea, lakes, marsh ----
  const hill = mk(STRIP_W, H, g => {
    const M = B.mid;
    if (M.t === 'hills'){
      for (let x = 0; x < STRIP_W; x++){ const t = x / STRIP_W * Math.PI * 2, k = M.low ? .45 : 1;
        const y = Math.round(horizon - (10 + 6 * Math.sin(t * 3 + 1) + 4 * Math.sin(t * 5 + 2) + 3 * Math.sin(t * 9)) * k);
        P(g, M.c, x, y, 1, horizon - y); P(g, shade(M.c, .18), x, y, 1, 1); if ((x + y) % 9 === 0) P(g, shade(M.c, -.12), x, y + 3, 2, 1); }
    } else if (M.t === 'sea' || M.t === 'lake' || M.t === 'marsh'){
      const top = horizon - (M.t === 'sea' ? 16 : M.t === 'lake' ? 10 : 7);
      P(g, M.c, 0, top, STRIP_W, horizon - top); P(g, shade(M.c, .2), 0, top, STRIP_W, 2);
      for (let i = 0; i < (M.frozen ? 40 : 90); i++) P(g, M.frozen ? '#ffffff' : shade(M.c, .45), Math.floor(r() * STRIP_W), top + 2 + Math.floor(r() * (horizon - top - 3)), 2 + Math.floor(r() * 4), 1);
      if (M.cliffs) for (let x = 0; x < STRIP_W; x++){ const t = x / STRIP_W * Math.PI * 2, h = Math.max(0, Math.round(12 * Math.sin(t * 3) + 6 * Math.sin(t * 7))); if (h > 0){ P(g, M.cliffs, x, horizon - h, 1, h); P(g, shade(M.cliffs, .2), x, horizon - h, 1, 1); } }
      if (M.surf) for (let x = 0; x < STRIP_W; x += 1) if ((x * 7) % 23 < 12) P(g, '#ffffff', x, horizon - 2 - ((x >> 3) % 2), 1, 1);
      if (M.boats) for (let i = 0; i < 3; i++){ const b = PROP.sailboat(r); wrap(g, b, Math.floor(r() * STRIP_W), top - b.height + 5); }
    }
  });
  // ---- the line of props along the horizon ----
  const trees = mk(STRIP_W, H, g => {
    const tot = B.line.reduce((s, [, w]) => s + w, 0); let x = 2;
    while (x < STRIP_W - 4){
      let q = r() * tot, kind = B.line[0][0]; for (const [k, w] of B.line){ q -= w; if (q <= 0){ kind = k; break; } }
      const img = PROP[kind](r);
      wrap(g, img, x, horizon - img.height + 1);
      x += Math.max(3, Math.floor(img.width * .8)) + B.gap[0] + Math.floor(r() * (B.gap[1] - B.gap[0] + 1));
    }
  });
  return { far, hill, trees };
}

let K = 1, BW = 320, BH = 180, buf = null, bx = null, horizon = 120, trackY = 140;
let paused = false;
const V = {                                        // visual state (not saved)
  x:0, v:0, target:0, station:null, stationTown:null, decel:null, accel:0, smoke:[], snow:[], biome:'prairie', prevBiome:null, fade:1, float:[], arriveAt:0,
  depart(){ this.accel = 2.2; this.decel = null; },
  arrive(town){ const rolling = !!this.decel; if (rolling){ const d = this.decel; this.x = d.x0 + d.v0 * d.cruise + d.v0 * d.D / 2; } this.decel = null; this.v = 0; this.stationTown = town; if (!rolling || this.station === null) this.placeStation(); setBiome(TOWN[town].biome); },
  placeStation(){ this.station = this.x + stationStopX(); },
};
const CRUISE = 64;
function trainFront(){ return Math.round(BW * .7); }
const stationStopX = () => trainFront() - 62;                // station's left edge when stopped: the platform's right end sits past the engine
function trainLen(){ return 78 + G.train.cars.length * (CAR_W + 3); }
let sprites = { loco:null, cars:{}, carsN:{}, station:{}, people:[] };
function buildSprites(){
  sprites.loco = locoSprite(loco());
  for (const t of Object.keys(CARS)){ sprites.cars[t] = carSprite(t, false); sprites.carsN[t] = carSprite(t, true); }
  for (const t of TOWNS) sprites.station[t.id] = stationSprite(t.roof);
  sprites.people = Array.from({ length:16 }, (_, i) => personSprite(i * 7 + 3, i % 6 === 5));
}
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
  cv.width = W; cv.height = H;
  K = Math.max(1, Math.round(H / 160));
  BW = Math.ceil(W / K); BH = Math.ceil(H / K);
  buf = mk(BW, BH); bx = buf.getContext('2d');
  const barTop = $('#bar').getBoundingClientRect().top || (innerHeight - 64), barGame = (innerHeight - barTop) * dpr / K;
  trackY = Math.round(BH - barGame - 10);
  horizon = trackY - 16;
  strips = {};
  if (G && V.stationTown) V.placeStation();
}
function getStrips(b){ return strips[b] || (strips[b] = makeStrips(b, BH, horizon)); }
function setBiome(b){ if (b === V.biome) return; V.prevBiome = V.biome; V.biome = b; V.fade = 0;
  // the weather has to make sense for the new land: no rain over the desert, snow only where it's cold
  const B = BIOMES[b], w = G && G.weather;
  if (w && ((w.k === 'rain' || w.k === 'storm') && B.rain < .1 || w.k === 'snow' && !B.snow)) w.until = 0;
}
// weather lasts a few game hours, then rolls again for wherever the train is
function weatherTick(force){
  const now = G.day * 24, B = BIOMES[V.biome];
  if (!G.weather) G.weather = { k:'clear', until:0 };
  if (!force && G.weather.until > now) return;
  const roll = Math.random();
  const k = B.snow && roll < B.snow ? 'snow' : roll < B.rain ? (Math.random() < .2 ? 'storm' : 'rain') : 'clear';
  G.weather = { k, until:now + 2 + Math.random() * 5 };
}
const weather = () => (G && G.weather ? G.weather.k : 'clear');

// time of day: 0 = morning, .25 noon, .5 dusk, .75 night
function lightAt(tod){
  // returns [tintColor, alpha, nightness]
  const k = (tod % 1 + 1) % 1;
  if (k < .08) return ['#ff9a6a', .18 * (1 - k / .08), 0];
  if (k < .42) return ['#000000', 0, 0];
  if (k < .55){ const t = (k - .42) / .13; return ['#ff7a3a', .22 * t, t * .2]; }
  if (k < .62){ const t = (k - .55) / .07; return ['#24305e', .22 + .3 * t, .2 + .8 * t]; }
  if (k < .92) return ['#1a2450', .52, 1];
  const t = (k - .92) / .08; return ['#4a3a6a', .52 - .3 * t, 1 - t];
}

function update(dt){
  // trip clock
  if (G.trip && !paused && !G.paused && !(V.reqOpen && G.trip.el >= segTime())){
    const T = G.trip;
    T.el += dt;
    advanceDay(dt / SEC_PER_HOUR / 24);
    { const use = (T.fuel || 0) * dt / T.secs; G.fuel = Math.max(0, G.fuel - use); T.burned = (T.burned || 0) + use; }   // coal burns as you go
    weatherTick();
    // approach: the station appears off the right edge while we cruise, then we brake and stop right at the platform.
    // it is timed so the stop lands exactly when the trip clock runs out
    if (!V.decel){
      const left = (T.segs - T.seg - 1) * segTime() + (segTime() - T.el);
      const v0 = Math.max(20, V.v), D = 2.6 + 1.7 * (loco().speed - 1), stopX = stationStopX(), dist = BW + 12 - stopX;   // faster engines brake earlier
      const cruise = Math.max(0, (dist - v0 * D / 2) / v0);
      if (left <= cruise + D){
        const Dd = Math.min(D, left * .95);
        V.decel = { t:0, D:Dd, v0, cruise:Math.max(0, left - Dd), x0:V.x };
        // place the station so we stop at it wherever the clock says we are
        const s = v0 * V.decel.cruise + v0 * Dd / 2;
        if (V.station !== null){ V.oldStation = V.station; V.oldTown = V.stationTown; }
        V.station = V.x + s + stopX; V.stationTown = T.to;
      }
    }
    setBiome(V.decel ? TOWN[T.to].biome : sceneryAt(T));
    if (T.el >= segTime() && !V.reqOpen) segmentDone();           // a stop or road event waits for the passenger popup to close
  }
  // speed
  if (V.decel){
    const d = V.decel; if (!G.paused) d.t += dt;
    const tb = d.t - d.cruise;                                   // time since braking started
    V.v = tb <= 0 ? d.v0 : Math.max(0, d.v0 * (1 - tb / d.D));
    const s = tb <= 0 ? d.v0 * d.t : d.v0 * d.cruise + d.v0 * Math.min(tb, d.D) - d.v0 * Math.min(tb, d.D) ** 2 / (2 * d.D);
    if (G.paused) V.v = 0;
    V.x = d.x0 + s - V.v * dt;                                   // the line below adds v*dt back
  }
  else if (G.trip){
    const target = G.paused ? 0 : paused ? CRUISE * .35 : CRUISE * loco().speed;           // 30 mph = 1x, 45 = 1.5x, 60 = 2x, 85 = 2.8x
    V.v += (target - V.v) * Math.min(1, dt * (V.accel > 0 ? .9 : 1.5)); V.accel = Math.max(0, V.accel - dt);
  } else V.v = 0;
  V.x += V.v * dt;
  V.bobX = (V.bobX || 0) + Math.min(V.v, CRUISE) * dt;   // the rock-and-bounce keeps the 30 mph rhythm on every engine
  if (V.station !== null && V.station - V.x < -400 && G.trip && !V.decel) { V.station = null; V.stationTown = null; }
  V.fade = Math.min(1, V.fade + dt / 1.6);
  // visual time of day glides between segments
  // smoke
  V.smokeT = (V.smokeT || 0) - dt;
  if (V.smokeT <= 0){
    V.smokeT = V.v > 5 ? .09 : .45;
    const fx = trainFront() - 22, fy = trackY - 36;
    V.smoke.push({ x:fx + V.x, y:fy, r:1.5, vx:-(V.v * .15) + (Math.random() - .5) * 4, vy:-(V.v > 5 ? 10 : 6) - Math.random() * 4, life:0, max:V.v > 5 ? 2.2 : 3 });
  }
  for (const s of V.smoke){ s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy *= 1 - dt * .6; s.r = 1.5 + s.life * 3.2; }
  V.smoke = V.smoke.filter(s => s.life < s.max);
  // snow, rain and lightning
  const wk = weather(), snowing = wk === 'snow', raining = wk === 'rain' || wk === 'storm';
  if (snowing && V.snow.length < 90) for (let i = 0; i < 2; i++) V.snow.push({ x:Math.random() * BW * 1.3, y:-2, vy:8 + Math.random() * 10, ph:Math.random() * 6 });
  for (const s of V.snow){ s.y += s.vy * dt; s.x += (Math.sin(s.ph + s.y / 12) * 6 - V.v * .4) * dt; if (s.x < 0) s.x += BW; }
  V.snow = V.snow.filter(s => s.y < trackY + 10);
  const want = wk === 'storm' ? 260 : wk === 'rain' ? 140 : 0;
  V.rain = V.rain || [];
  for (let i = 0; i < 12 && V.rain.length < want; i++) V.rain.push({ x:Math.random() * (BW + 120), y:-Math.random() * 40, vy:190 + Math.random() * 70, len:3 + Math.random() * 3 });
  for (const d of V.rain){ d.y += d.vy * dt; d.x -= (45 + V.v * .7) * dt; }
  V.splash = (V.splash || []).filter(s => (s.t += dt) < .18);
  V.rain = V.rain.filter(d => { if (d.y > trackY + 6){ if (Math.random() < .5) V.splash.push({ x:d.x, y:horizon + Math.random() * (trackY + 6 - horizon), t:0 }); return raining && V.rain.length <= want + 20 ? (d.y = -Math.random() * 30, d.x = Math.random() * (BW + 120), true) : false; } return true; });
  V.flash = Math.max(0, (V.flash || 0) - dt * 4);
  if (wk === 'storm' && Math.random() < dt / 5) V.flash = 1;
  for (const f of V.float){ f.t += dt; }
  V.float = V.float.filter(f => f.t < 1.6);
}

function drawLayer(img, factor, alpha){
  if (!img) return;
  let off = -((V.x * factor) % STRIP_W); if (off > 0) off -= STRIP_W;
  bx.globalAlpha = alpha;
  for (let x = Math.round(off); x < BW; x += STRIP_W) bx.drawImage(img, x, 0);
  bx.globalAlpha = 1;
}
function drawScene(){
  const tod = todNow();
  const [tint, ta, night] = lightAt(tod);
  const B = BIOMES[V.biome] || BIOMES.prairie, PB = BIOMES[V.prevBiome] || B, f = V.fade;
  // sky bands
  const bands = B.sky.length, top = 0, bh = Math.ceil(horizon / bands);
  for (let i = 0; i < bands; i++){ bx.fillStyle = f < 1 ? mix(PB.sky[i], B.sky[i], f) : B.sky[i]; bx.fillRect(0, top + i * bh, BW, bh + 1); }
  // stars + sun/moon

  const sunA = ((tod + .1) % 1) / .62;                       // sun arcs across between morning and dusk
  if (sunA <= 1 && !['rain','storm','snow'].includes(weather())){ const sx = BW * (.1 + .8 * sunA), sy = horizon * (.7 - .55 * Math.sin(sunA * Math.PI)); disc(bx, sx | 0, sy | 0, 7, '#fff3c0'); disc(bx, sx | 0, sy | 0, 5, '#ffe680'); }
  else { const mA = ((tod - .52 + 1) % 1) / .48; const mx = BW * (.1 + .8 * mA), my = horizon * (.7 - .5 * Math.sin(mA * Math.PI)); disc(bx, mx | 0, my | 0, 5, '#eef2ff'); disc(bx, (mx | 0) + 2, (my | 0) - 1, 4, mix(B.sky[0], '#1a2450', .5)); }
  // clouds: puffy, and heavy and grey when it's wet
  const wk = weather(), wet = wk === 'rain' || wk === 'storm' || wk === 'snow';
  if (wet){ bx.globalAlpha = wk === 'storm' ? .55 : .38; bx.fillStyle = wk === 'snow' ? '#c8d0dc' : '#6a7484'; bx.fillRect(0, 0, BW, horizon); bx.globalAlpha = 1; }
  const nC = wet ? 9 : 5;
  for (let i = 0; i < nC; i++){
    const span = BW + 120, cx = ((hash(i + 3) * span * 2 - V.x * .04 - performance.now() / 1000 * 2) % span + span) % span - 60, cy = 12 + hash(i + 9) * horizon * (wet ? .3 : .38), sc = .8 + hash(i + 21) * .7;
    const lit = night > .5 ? (wet ? '#5a6078' : '#8a94b8') : wet ? (wk === 'storm' ? '#7a808e' : '#a4acb8') : '#ffffff', dk = night > .5 ? '#4a5068' : wet ? (wk === 'storm' ? '#5e6470' : '#8a929e') : '#dde9f4';
    disc(bx, cx | 0, (cy + 2) | 0, Math.round(5 * sc), dk); disc(bx, (cx + 9 * sc) | 0, (cy - 1) | 0, Math.round(7 * sc), dk); disc(bx, (cx + 20 * sc) | 0, (cy + 2) | 0, Math.round(5 * sc), dk);
    disc(bx, cx | 0, cy | 0, Math.round(5 * sc) - 1, lit); disc(bx, (cx + 9 * sc) | 0, (cy - 3) | 0, Math.round(7 * sc) - 1, lit); disc(bx, (cx + 20 * sc) | 0, cy | 0, Math.round(5 * sc) - 1, lit);
    bx.fillStyle = dk; bx.fillRect((cx - 4) | 0, (cy + 4) | 0, (28 * sc) | 0, 2);
  }
  // parallax layers (cross-fade when the land changes)
  const S = getStrips(V.biome), PS = V.prevBiome && f < 1 ? getStrips(V.prevBiome) : null;
  if (PS){ drawLayer(PS.far, .08, 1 - f); drawLayer(PS.hill, .2, 1 - f); drawLayer(PS.trees, .42, 1 - f); }
  drawLayer(S.far, .08, PS ? f : 1);
  if (B.fog || B.smog){ bx.globalAlpha = .35 * (PS ? f : 1); bx.fillStyle = B.smog ? '#b8aa9a' : '#f4f6f8'; bx.fillRect(0, horizon - 40, BW, 40); bx.globalAlpha = 1; }
  drawLayer(S.hill, .2, PS ? f : 1); drawLayer(S.trees, .42, PS ? f : 1);
  // ground
  const gc = f < 1 ? mix(PB.ground[0], B.ground[0], f) : B.ground[0], gd = f < 1 ? mix(PB.ground[1], B.ground[1], f) : B.ground[1];
  bx.fillStyle = gc; bx.fillRect(0, horizon, BW, BH - horizon);
  if (B.rows && f >= 1){ bx.fillStyle = gd; for (let y = horizon + 2; y < trackY - 3; y += 3) bx.fillRect(0, y, BW, 1); }
  bx.fillStyle = gd; for (let i = 0; i < 60; i++){ const gx = ((hash(i * 31) * 900 - V.x) % 900 + 900) % 900; if (gx < BW) bx.fillRect(gx | 0, horizon + 2 + (hash(i * 17) * (trackY - horizon - 4) | 0), 3, 1); }
  // telegraph poles + wires
  drawPoles();
  // stations (the one you just left can still be sliding away when the next one comes into view)
  if (V.oldStation != null){ const ox = Math.round(V.oldStation - V.x), osp = sprites.station[V.oldTown]; if (ox > -200) bx.drawImage(osp, ox, trackY - osp.height + 2); else V.oldStation = null; }
  if (V.station !== null){
    const sx = Math.round(V.station - V.x), sp = sprites.station[V.stationTown];
    if (sx > -200 && sx < BW + 50){
      bx.drawImage(sp, sx, trackY - sp.height + 2);
      if (G.town === V.stationTown){       // people waiting
        const o = G.offers[G.town], want = Math.min(8, o.pax.reduce((s, p) => s + Math.ceil(p.n / 2.5), 0)), t = performance.now() / 1000;
        for (let i = 0; i < want; i++){
          const p = sprites.people[(i * 5 + G.town.charCodeAt(0)) % 16], px0 = sx + 68 + i * 10 + (i % 2 ? 2 : 0), hop = Math.sin(t * 2 + i * 1.7) > .93 ? 1 : 0;
          bx.drawImage(p, px0, trackY - 7 - p.height + 1 - hop);
        }
      }
    }
  }
  // track
  drawTrack();
  // train
  drawTrain(night);
  // smoke above train
  for (const s of V.smoke){ const a = 1 - s.life / s.max, x = Math.round(s.x - V.x), y = Math.round(s.y), r = Math.round(s.r);
    bx.globalAlpha = Math.min(1, a * 1.4); disc(bx, x, y, r, night > .5 ? '#8a8fa8' : '#ececf2'); disc(bx, x - 1, y - 1, Math.max(1, r - 2), night > .5 ? '#a8adc4' : '#ffffff'); bx.globalAlpha = 1; }
  // foreground bushes (fast parallax)
  // night tint, then the lights on top of it
  if (ta > 0){ bx.globalAlpha = ta; bx.fillStyle = tint; bx.fillRect(0, 0, BW, BH); bx.globalAlpha = 1; }
  if (night > .3) drawLights(night);
  // snow
  if (V.snow.length){ bx.fillStyle = '#ffffff'; for (const s of V.snow) bx.fillRect(s.x | 0, s.y | 0, s.vy > 14 ? 2 : 1, s.vy > 14 ? 2 : 1); }
  if (V.rain && V.rain.length){ bx.fillStyle = 'rgba(205,220,240,.75)'; for (const d of V.rain){ const x = d.x | 0, y = d.y | 0; for (let k = 0; k < d.len; k++) bx.fillRect(x + (k >> 1), y - k, 1, 1); }
    bx.fillStyle = 'rgba(225,235,250,.8)'; for (const sp of V.splash){ const x = sp.x | 0, y = sp.y | 0, o = sp.t > .09 ? 1 : 0; bx.fillRect(x - 1 - o, y - o, 1, 1); bx.fillRect(x + 1 + o, y - o, 1, 1); } }
  if (V.flash > 0){ bx.globalAlpha = V.flash * .55; bx.fillStyle = '#ffffff'; bx.fillRect(0, 0, BW, BH); bx.globalAlpha = 1; }
  // floating money
  bx.font = `bold 8px Silkscreen, monospace`; bx.textAlign = 'center';
  for (const fl of V.float){ bx.globalAlpha = 1 - fl.t / 1.6; bx.fillStyle = '#24150f'; bx.fillText(fl.txt, fl.x + 1, fl.y - fl.t * 14 + 1); bx.fillStyle = fl.col; bx.fillText(fl.txt, fl.x, fl.y - fl.t * 14); }
  bx.globalAlpha = 1;
  // blit
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, BW * K, BH * K);
}
// gravel bed, wooden ties with grain, rails with a shiny head, tie plates and spikes
function drawTrack(){
  const y = trackY;
  // ballast: a mounded gravel bed
  bx.fillStyle = '#867a6e'; bx.fillRect(0, y - 1, BW, 11);
  bx.fillStyle = '#a2968a'; bx.fillRect(0, y - 1, BW, 1);
  bx.fillStyle = '#766a5e'; bx.fillRect(0, y + 7, BW, 1);
  bx.fillStyle = '#665c52'; bx.fillRect(0, y + 8, BW, 1);
  bx.fillStyle = '#544a42'; bx.fillRect(0, y + 9, BW, 1);
  const g0 = Math.floor(V.x);
  for (let x = 0; x < BW; x++) for (let k = 0; k < 2; k++){ const h = hash(x * 3 + k * 7919 + g0 * 3); if (h > .45){ bx.fillStyle = h > .82 ? '#bcb0a2' : h > .64 ? '#5a5048' : '#968a7e'; bx.fillRect(x, y + 1 + Math.floor(hash(x + k * 31 + g0 + 999) * 9), 1, 1); } }
  // ties: dark wood with a lit top edge, grain and an end-grain face
  const TS = 9, t0 = -(V.x % TS);
  for (let x = t0 - TS; x < BW; x += TS){
    const X = Math.round(x), k = Math.floor((x + V.x) / TS), wood = ['#6b4a2e', '#644428', '#705034'][((k % 3) + 3) % 3];
    bx.fillStyle = '#3a2618'; bx.fillRect(X - 1, y + 1, 8, 5);
    bx.fillStyle = wood; bx.fillRect(X, y + 1, 6, 4);
    bx.fillStyle = '#8a6440'; bx.fillRect(X, y + 1, 6, 1);
    bx.fillStyle = '#4e3420'; bx.fillRect(X + 1 + (k & 1), y + 3, 3, 1); bx.fillRect(X, y + 4, 6, 1);
    // tie plate + two spikes under the rail
    bx.fillStyle = '#4a4a52'; bx.fillRect(X, y, 6, 1); bx.fillStyle = '#26262c'; bx.fillRect(X, y, 1, 1); bx.fillRect(X + 5, y, 1, 1);
  }
  // rail: shiny head, darker web, wide base
  bx.fillStyle = '#2e3038'; bx.fillRect(0, y - 3, BW, 1);
  bx.fillStyle = '#d6dae2'; bx.fillRect(0, y - 2, BW, 1);
  bx.fillStyle = '#9aa0ab'; bx.fillRect(0, y - 1, BW, 1);
  bx.fillStyle = '#5a5e68'; bx.fillRect(0, y, BW, 1);
  bx.fillStyle = '#3a3d46'; bx.fillRect(0, y + 1, BW, 1);
  // joint bars every rail length
  const J = 72, j0 = -(V.x % J);
  for (let x = j0 - J; x < BW; x += J){ const X = Math.round(x); bx.fillStyle = '#2e3038'; bx.fillRect(X, y - 2, 1, 2); bx.fillStyle = '#6a6e78'; bx.fillRect(X - 3, y - 1, 7, 2); bx.fillStyle = '#26262c'; bx.fillRect(X - 2, y, 1, 1); bx.fillRect(X + 2, y, 1, 1); }
}
// wooden telegraph poles: shaded pole, two crossarms with glass insulators, sagging wires
function drawPoles(){
  const PG = 160, p0 = -((V.x * .9) % PG), top = horizon - 34;
  const wires = [[-6, 0], [6, 0]];
  for (let x = p0 - PG; x < BW + PG; x += PG){
    const X = Math.round(x);
    // wires to the next pole
    bx.fillStyle = 'rgba(44,38,34,.55)';
    for (const [dx, dy] of wires){ let py = top - 2 + dy; for (let i = 0; i <= PG; i++){ const ny = Math.round(top - 2 + dy + Math.sin(i / PG * Math.PI) * 7); bx.fillRect(X + dx + i, Math.min(py, ny), 1, Math.abs(ny - py) + 1); py = ny; } }
    // pole
    bx.fillStyle = '#2a1c12'; bx.fillRect(X - 2, top - 2, 5, horizon - top + 9);
    bx.fillStyle = '#6a4c34'; bx.fillRect(X - 1, top - 1, 3, horizon - top + 7);
    bx.fillStyle = '#86644a'; bx.fillRect(X - 1, top - 1, 1, horizon - top + 7);
    bx.fillStyle = '#4e3626'; bx.fillRect(X + 1, top - 1, 1, horizon - top + 7);
    for (let yy = top + 10; yy < horizon + 4; yy += 7) { bx.fillStyle = '#4e3626'; bx.fillRect(X, yy, 1, 2); }
    bx.fillStyle = '#3a3a40'; bx.fillRect(X - 2, top - 3, 5, 2);
    // crossarms + insulators
    for (const dy of [0, 6]){
      bx.fillStyle = '#2a1c12'; bx.fillRect(X - 8, top + dy, 17, 3);
      bx.fillStyle = '#7a5a40'; bx.fillRect(X - 7, top + dy + 1, 15, 1);
      for (const dx of dy ? [-4, 4] : [-6, -4, 4, 6]){ bx.fillStyle = '#2a4a44'; bx.fillRect(X + dx - 1, top + dy - 2, 3, 2); bx.fillStyle = '#7fd0b8'; bx.fillRect(X + dx, top + dy - 2, 1, 1); }
    }
    // base: a little mound of dirt
    bx.fillStyle = '#4e3a2a'; bx.fillRect(X - 3, horizon + 5, 7, 2);
  }
}
function drawTrain(night){
  const front = trainFront(), base = trackY - 1, bob = V.v > 5 ? (Math.floor((V.bobX || 0) / 9) % 2) : 0;
  const L = sprites.loco, lx = front - L.width;
  let x = lx;
  // cars (behind the loco, to the left)

const CARGO_CACHE = new Map(), LOAD_H = 20, LOAD_RIM = 16;             // the load canvas: the car's rim sits on row 16
function drawCargo(x, y, idx){

  const units = []; for (const [g, q] of Object.entries(G.cargo)) if (q > 0 && g !== 'moon') for (let i = 0; i < q; i++) units.push(g);
  const mine = units.slice(freightIdx * 10, freightIdx * 10 + 10), n = mine.length;

  for (const g of mine){ const last = groups[groups.length - 1]; if (last && last.g === g) last.n++; else groups.push({ g, n:1 }); }
  const frame = groups.some(gr => gr.g === 'cattle') ? Math.floor(performance.now() / 700) % 2 : 0;
  const key = groups.map(gr => gr.g + gr.n).join() + (full ? 'F' : 'p') + frame + freightIdx;
  let img = CARGO_CACHE.get(key);

    if (CARGO_CACHE.size > 60) CARGO_CACHE.clear();

      let gx = 2; const inner = CAR_W - 4;

  let gx = x + 2;

    if (gr.g === 'gold') for (let k = 0; k < 3; k++){ const ph = performance.now() / 600 + k * 2.1; if (Math.sin(ph) > .6){ const sx = gx + 3 + Math.round(hash(k * 7 + freightIdx) * (w - 6)), sy = y + 13 - (full ? 5 : 2) - Math.round(hash(k + 3) * 2); P(bx, '#fffbe0', sx, sy, 1, 1); P(bx, 'rgba(255,240,170,.8)', sx - 1, sy, 3, 1); P(bx, 'rgba(255,240,170,.8)', sx, sy - 1, 1, 3); } }

}

  coal(g, x0, w, full, r){
    const H = full ? 7 : 3;
    for (let xx = 0; xx < w; xx++){ const top = heapTop(xx, w, H, r); P(g, '#2a2a30', x0 + xx, top, 1, LOAD_H - top); }
    for (let i = 0; i < w * (full ? 1.6 : .8); i++){ const xx = Math.floor(r() * (w - 2)), top = heapTop(xx, w, H, r) + Math.floor(r() * (H + 1));      // lumps catching the light

  grain(g, x0, w, full, r){

function wheel(cx, cy, r, ang){

  disc(bx, cx, cy, r + 1, '#24150f'); disc(bx, cx, cy, r, '#3a3d4a');
  if (r > 3) disc(bx, cx, cy, r - 2, '#2b2d3a');

  bx.fillStyle = '#b8322f'; bx.fillRect(cx - (r > 3 ? 1 : 0), cy - (r > 3 ? 1 : 0), r > 3 ? 2 : 1, r > 3 ? 2 : 1);
}

// how far a town is from where you are (counting the rest of the current trip) and how many stops it takes
function awayText(to){
  let mi = 0, from = G.town, stops = 0;
  if (G.trip){ const T = G.trip; mi = T.miles * (1 - Math.min(1, (T.seg + T.el / segTime()) / T.segs)); from = T.to; stops = 1; }
  if (from === to) return `${fmtMi(mi)} away · this stop`;
  const path = route(from, to).path; mi += pathMiles(path); stops += path.length - 1;
  return `${fmtMi(mi)} away · ${stops} stop${stops === 1 ? '' : 's'}`;
}

function cargoList(){ const k = Object.keys(G.cargo).filter(g => G.cargo[g] > 0); return `<h3 style="margin:8px 0 6px">Cargo ${cargoUsed()}/${capOf()}</h3>` + (k.length ? k.map(g => `<div class="card row">${gImg(g)}<span class="grow">${GOOD[g].n}</span><b>${G.cargo[g]}</b></div>`).join('') : '<div class="muted">Empty.</div>'); }

// ---- panel actions ----
$('#panel').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const [a, x, y] = b.dataset.a.split(':');
  const t = G.town;
  switch (a){
    case 'close': closePanel(); return;
    case 'tab': tabs[x] = y; break;
    case 'buy': { const n = +y, g = x; let spent = 0, k = 0;
      for (; k < n; k++){ const p = buyP(t, g); if (G.money < p) break; const room = g === 'moon' ? capOf() - cargoUsed() + hideCap() - moonUsed() : capOf() - cargoUsed(); if (room <= 0) break;
        G.money -= p; spent += p; G.paid[g] = Math.round(((G.paid[g] || 0) * (G.cargo[g] || 0) + p) / ((G.cargo[g] || 0) + 1)); G.cargo[g] = (G.cargo[g] || 0) + 1; G.mk[t][g].press = clamp(G.mk[t][g].press - .03, -.6, .75); }
      if (k) toast(`Bought ${k} ${GOOD[g].n} for ${fmt(spent)}`); break; }
    case 'sell': { const n = +y, g = x; let got = 0, k = 0;
      for (; k < n && (G.cargo[g] || 0) > 0; k++){ const p = sellP(t, g); G.money += p; got += p; G.cargo[g]--; G.mk[t][g].press = clamp(G.mk[t][g].press + .036, -.6, .75); }
      if (!G.cargo[g]) { delete G.cargo[g]; delete G.paid[g]; }
      if (k){ const prof = got - (G.paid[g] || 0) * 0; G.stats.earned += got; floatText('+' + fmt(got), '#ffd166'); toast(`Sold ${k} ${GOOD[g].n} for ${fmt(got)}`, 'g'); } break; }
    case 'board': { const o = G.offers[t], p = o.pax.find(q => q.id === +x); if (!p) break; const k = Math.min(p.n, seatsFree(p.cls)); if (k <= 0) break;
      if (k < p.n){ G.pax.push({ ...p, id:G.cid++, n:k }); p.n -= k; toast(`${k} of the group boarded. ${p.n} keep waiting.`, 'g'); break; }
      o.pax.splice(o.pax.indexOf(p), 1); G.pax.push(p); toast(`${p.n} passenger${p.n > 1 ? 's' : ''} boarded for ${TOWN[p.to].n}`, 'g'); break; }
    case 'take': { const o = G.offers[t], c = o.con.find(q => q.id === +x); if (!c || G.contracts.length >= 4) break; o.con.splice(o.con.indexOf(c), 1); G.contracts.push(c); toast('Contract accepted', 'g'); break; }
    case 'go': depart(x); return;
    case 'fuel': { const fp = fuelPrice(t), room = fuelCap() - G.fuel; let tons = x === 'fill' ? Math.min(room, Math.floor(G.money / fp * 10) / 10) : Math.min(1, room);

    case 'reserve': { const T = G.trip; if (!T || T.reserved) break; let g = T.board.find(q => q.id === +x); if (!g || !fitsOnArrival(g)) break;

function showArrival(t, lines, fares, inspect){
