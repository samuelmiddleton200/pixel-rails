        ${bank ? `<div class="row" style="margin-top:6px;flex-wrap:wrap">${[250, 1000, 3000].map(v => `<button class="btn" data-a="borrow:${v}" ${v > limit ? 'disabled' : ''}>Borrow ${fmt(v)}</button>`).join('')}
          <button class="btn go" data-a="repay" ${!G.loan || G.money < 1 ? 'disabled' : ''}>Repay ${fmt(Math.min(G.loan, Math.max(0, G.money)))}</button></div><div class="small muted">You can borrow ${fmt(limit)} more.</div>` : `<div class="small muted" style="margin-top:4px">Banks are in ${TOWNS.filter(x => x.bank).map(x => x.n).join(', ')}.</div>`}</div>
        <div class="card small">Net worth: <b>${fmt(netWorth())}</b> · Most money held: ${fmt(G.stats.best)} · Trips: ${G.stats.trips}</div>`;
    } else body = newsList(25);
    return panelShell('Bank', G.town && TOWN[G.town].bank ? TOWN[G.town].n + ' Bank' : '', head + body);
  },
  gear(){
    return panelShell('Settings', '', `<div class="card">Pixel Rails: first build. Your game saves on this phone automatically.</div>
      <div class="card row"><span class="grow">Start a brand new world (new prices, new everything)</span><button class="btn bad" data-a="reset">${resetArm ? 'Tap again to confirm' : 'New game'}</button></div>`);
  },
};
let resetArm = false;
function newsList(n){ return `<h3 style="margin:10px 0 6px">News</h3>` + G.news.slice(0, n).map(x => `<div class="card small"><b>Day ${x.day}:</b> ${esc(x.txt)}</div>`).join(''); }
function cargoList(){ const k = Object.keys(G.cargo).filter(g => G.cargo[g] > 0); return `<h3 style="margin:8px 0 6px">Cargo ${cargoUsed()}/${capOf()}</h3>` + (k.length ? k.map(g => `<div class="card row">${gImg(g)}<span class="grow">${GOOD[g].n}</span><b>${G.cargo[g]}</b></div>`).join('') : '<div class="muted">Empty.</div>'); }

// ---- panel actions ----
$('#panel').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const [a, x, y] = b.dataset.a.split(':');
  const t = G.town;
  switch (a){
    case 'close': closePanel(); return;
    case 'tab': tabs[x] = y; break;
    case 'buy': { const n = +y, g = x; let spent = 0, k = 0;
      for (; k < n; k++){ const p = buyP(t, g); if (G.money < p) break; const room = g === 'moon' ? capOf() - cargoUsed() + hideCap() - moonUsed() : capOf() - cargoUsed(); if (room <= 0) break;
        G.money -= p; spent += p; G.paid[g] = Math.round(((G.paid[g] || 0) * (G.cargo[g] || 0) + p) / ((G.cargo[g] || 0) + 1)); G.cargo[g] = (G.cargo[g] || 0) + 1; G.mk[t][g].press = clamp(G.mk[t][g].press - .022, -.6, .75); }
      if (k) toast(`Bought ${k} ${GOOD[g].n} for ${fmt(spent)}`); break; }
    case 'sell': { const n = +y, g = x; let got = 0, k = 0;
      for (; k < n && (G.cargo[g] || 0) > 0; k++){ const p = sellP(t, g); G.money += p; got += p; G.cargo[g]--; G.mk[t][g].press = clamp(G.mk[t][g].press + .028, -.6, .75); }
      if (!G.cargo[g]) { delete G.cargo[g]; delete G.paid[g]; }
      if (k){ const prof = got - (G.paid[g] || 0) * 0; G.stats.earned += got; floatText('+' + fmt(got), '#ffd166'); toast(`Sold ${k} ${GOOD[g].n} for ${fmt(got)}`, 'g'); } break; }
    case 'board': { const o = G.offers[t], p = o.pax.find(q => q.id === +x); if (!p) break; o.pax.splice(o.pax.indexOf(p), 1); G.pax.push(p); toast(`${p.n} passenger${p.n > 1 ? 's' : ''} boarded for ${TOWN[p.to].n}`, 'g'); break; }
    case 'take': { const o = G.offers[t], c = o.con.find(q => q.id === +x); if (!c || G.contracts.length >= 4) break; o.con.splice(o.con.indexOf(c), 1); G.contracts.push(c); toast('Contract accepted', 'g'); break; }
    case 'go': depart(x); return;
    case 'repair': { const cost = Math.ceil((100 - G.train.cond) * 3.2); if (G.money >= cost){ G.money -= cost; G.train.cond = 100; toast('Good as new!', 'g'); } break; }
    case 'buycar': { const c = CARS[x]; if (G.money >= c.price && G.train.cars.length < loco().cars){ G.money -= c.price; G.train.cars.push(x); toast(`${c.n} coupled on!`, 'g'); if (V.stationTown) V.placeStation(); } break; }
    case 'sellcar': { const i = +x, c = G.train.cars[i];
      if (c === 'freight' && capOf() - CARS.freight.cap < cargoUsed()){ toast('Unload the cargo first', 'r'); break; }
      if (c === 'coach' && seatsOf() - CARS.coach.seats < paxUsed('std')){ toast('Passengers are sitting in it!', 'r'); break; }
      if (c === 'luxury' && richOf() - CARS.luxury.rich < paxUsed('rich')){ toast('Passengers are sitting in it!', 'r'); break; }
      G.train.cars.splice(i, 1); G.money += CARS[c].price * .5; if (V.stationTown) V.placeStation(); break; }
    case 'loco': { const n = LOCOS[G.train.loco + 1]; if (n && G.money >= n.price){ G.money -= n.price; G.train.loco++; sprites.loco = locoSprite(loco()); toast(`The ${n.n} is yours!`, 'g'); if (V.stationTown) V.placeStation(); } break; }
    case 'hire': { const o = G.offers[t], c = o.hire.find(q => q.id === +x); if (!c || crew(c.role)) break; o.hire.splice(o.hire.indexOf(c), 1); G.crew.push(c); toast(`${c.name} joins the crew`, 'g'); break; }
    case 'fire': { const c = G.crew.find(q => q.id === +x); if (c){ G.crew.splice(G.crew.indexOf(c), 1); G.crew.forEach(q => q.mood = clamp(q.mood - 6, 0, 100)); toast(`${c.name} packs their bags`); } break; }
    case 'bonus': { const c = G.crew.find(q => q.id === +x); if (c && G.money >= c.wage * 2){ G.money -= c.wage * 2; c.mood = clamp(c.mood + 22, 0, 100); toast(`${c.name} grins ear to ear`, 'g'); } break; }
    case 'buysh': { const b = G.biz[t].find(q => q.id === x); if (b && G.money >= b.price && b.owned < 10){ G.money -= b.price; b.owned++; b.price = Math.round(b.price * 1.15 / 5) * 5; toast(`Bought a share of ${b.n}`, 'g'); } break; }
    case 'sellsh': { const b = G.biz[t].find(q => q.id === x); if (b && b.owned){ b.price = Math.round(b.price / 1.15 / 5) * 5; G.money += Math.round(b.price * .75); b.owned--; } break; }
    case 'borrow': G.loan += +x; G.money += +x; toast(`Borrowed ${fmt(+x)}`); break;
    case 'repay': { const v = Math.min(G.loan, Math.max(0, Math.floor(G.money))); G.loan -= v; G.money -= v; toast(`Repaid ${fmt(v)}`, 'g'); break; }
    case 'reset': if (!resetArm){ resetArm = true; setTimeout(() => { resetArm = false; if (panelName === 'gear') renderPanel(); }, 3000); break; }
      resetArm = false; try { localStorage.removeItem(SAVE_KEY); } catch (e2) {} newGame(); V.x = 0; V.smoke = []; buildSprites(); V.arrive(G.town); closePanel(); save(); showNews(G.news[0].txt); return;
  }
  save(); refreshHud(); if (panelName) renderPanel();
});

// ---- the map ----
// lower 48 outline and the Great Lakes, as [lon, lat]
const US = [[-124.7,48.4],[-123,49],[-95.2,49],[-95.2,49.4],[-94.8,48.7],[-89.6,48],[-84.8,46.5],[-84.4,45.9],[-83.5,46],[-82.5,45.3],[-82.4,43],[-83.1,42],[-79,42.9],
  [-79.2,43.4],[-76.3,43.6],[-75,44.9],[-71.5,45],[-70.6,45.5],[-69.2,47.4],[-67.8,47.1],[-67.8,45.7],[-67,44.8],[-68.8,44.3],[-70.2,43.6],[-70.8,42.9],[-70.6,42.6],
  [-71,42.3],[-70,41.8],[-70,41.6],[-71.4,41.4],[-72.9,41.2],[-74,40.6],[-74.2,39.6],[-74.9,38.9],[-75.5,38.4],[-76,37.3],[-75.7,36],[-75.6,35.2],[-76.5,34.7],
  [-78,33.9],[-79.2,33.2],[-79.9,32.7],[-81,31.8],[-81.4,30.7],[-81.3,29.8],[-80.6,28.4],[-80.1,26.8],[-80.4,25.2],[-81.1,25.1],[-81.8,26.4],[-82.7,27.7],
  [-82.6,28.8],[-83.6,29.8],[-84.4,30],[-85.4,29.7],[-86.5,30.4],[-88.5,30.4],[-89.6,30.2],[-89.2,29.2],[-90.5,29.1],[-91.6,29.6],[-93.8,29.7],[-95,29.2],
  [-97.2,27.6],[-97.4,25.9],[-99.1,26.4],[-100.3,28.2],[-101.4,29.8],[-102.5,29.8],[-103.2,29],[-104.5,29.6],[-106.5,31.8],[-108.2,31.8],[-108.2,31.3],[-111.1,31.3],
  [-114.8,32.5],[-117.1,32.5],[-118.4,33.9],[-120.6,34.6],[-121.9,36.6],[-122.5,37.8],[-123,38.3],[-123.8,39.8],[-124.2,41.8],[-124.5,43],[-124,46.3],[-124.7,48.4]];
const LAKES = [
  [[-92.1,46.7],[-90.4,46.6],[-88.4,47.4],[-86.5,46.5],[-84.6,46.5],[-85,47],[-87.3,47.9],[-89.6,48],[-91,47.3]],
  [[-87.8,42.1],[-87.1,41.6],[-86.4,42.4],[-86.2,43.7],[-85.6,45.2],[-84.8,45.8],[-86.2,45.9],[-87.6,44.9],[-87.9,43.4]],
  [[-84.7,45.8],[-83.4,45.3],[-82.5,43.4],[-81.8,43.6],[-81.7,45],[-80.4,45.6],[-81.8,46.1],[-84,46]],
  [[-83.4,41.7],[-82,42.3],[-79.8,42.8],[-78.9,42.9],[-79.8,42.3],[-81.5,41.6],[-82.7,41.4]],
  [[-79.8,43.3],[-78,43.4],[-76.3,43.6],[-76.6,44.1],[-78.4,43.9],[-79.6,43.7]],
];
function drawMap(){
  const box = $('#mapbox'), c = $('#mapcv'); if (!box || !c) return;
  const w = box.clientWidth, h = box.clientHeight, dpr = Math.min(devicePixelRatio || 1, 3);
  const S = 3;                                             // chunky pixels
  c.width = Math.ceil(w * dpr / S); c.height = Math.ceil(h * dpr / S);
  const g = c.getContext('2d'), W = c.width, H = c.height;
  const X = t => Math.round(8 + TOWN[t].x / 100 * (W - 16)), Y = t => Math.round(6 + TOWN[t].y / 62 * (H - 14));
  // land
  // sea, then the lower 48 (same projection as the towns), then the Great Lakes
  P(g, '#8fc0d8', 0, 0, W, H);
  for (let i = 0; i < 90; i++) P(g, '#a6cfe2', hash(i * 11) * W | 0, hash(i * 19) * H | 0, 3, 1);
  const LX = lon => 8 + (lon + 125) / 59 * (W - 16), LY = lat => 6 + (49.5 - lat) / 25 * (H - 14);
  const poly = (pts, col, dy = 0) => { g.fillStyle = col; g.beginPath(); pts.forEach(([lo, la], i) => i ? g.lineTo(LX(lo), LY(la) + dy) : g.moveTo(LX(lo), LY(la) + dy)); g.closePath(); g.fill(); };
  poly(US, '#8a6a42', 1); poly(US, '#d9c48e');
  for (const L of LAKES) poly(L, '#8fc0d8');
  for (let i = 0; i < 160; i++){ const x = hash(i * 3) * W | 0, y = hash(i * 5) * H | 0; if (g.getImageData(x, y, 1, 1).data[0] > 200) P(g, '#cbb57e', x, y, 2, 1); }
  // biome blobs
  for (const t of TOWNS){ const col = { plains:'#a9c47a', forest:'#6f9a5a', snow:'#eef2f8', desert:'#e6b47a', coast:'#e8d6a0', city:'#b4b0b8' }[t.biome]; g.fillStyle = col; g.beginPath(); g.ellipse(X(t.id), Y(t.id), 10, 7, 0, 0, Math.PI * 2); g.fill(); }
  // rails
  for (const [a, b] of EDGES){
    const x1 = X(a), y1 = Y(a), x2 = X(b), y2 = Y(b), n = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
    for (let i = 0; i <= n; i++){ const x = Math.round(x1 + (x2 - x1) * i / n), y = Math.round(y1 + (y2 - y1) * i / n); P(g, '#5a3a22', x, y, 1, 1); if (i % 3 === 0) P(g, '#8a6a4a', x - (Math.abs(y2 - y1) > Math.abs(x2 - x1) ? 1 : 0), y - (Math.abs(y2 - y1) > Math.abs(x2 - x1) ? 0 : 1), Math.abs(y2 - y1) > Math.abs(x2 - x1) ? 3 : 1, Math.abs(y2 - y1) > Math.abs(x2 - x1) ? 1 : 3); }
  }
  // planned route
  const sel = tabs.map && G.town && tabs.map !== G.town ? route(G.town, tabs.map).path : G.trip ? G.trip.path : null;
  if (sel) for (let k = 0; k < sel.length - 1; k++){ const x1 = X(sel[k]), y1 = Y(sel[k]), x2 = X(sel[k + 1]), y2 = Y(sel[k + 1]), n = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)); for (let i = 0; i <= n; i++) P(g, '#e8b23a', Math.round(x1 + (x2 - x1) * i / n) - 1, Math.round(y1 + (y2 - y1) * i / n) - 1, 2, 2); }
  // towns
  for (const t of TOWNS){ const x = X(t.id), y = Y(t.id); P(g, '#24150f', x - 3, y - 3, 7, 7); P(g, t.roof, x - 2, y - 2, 5, 5); P(g, shade(t.roof, .35), x - 2, y - 2, 5, 1); }
  // the train
  let tx, ty;
  if (G.town){ tx = X(G.town); ty = Y(G.town); }
  else { const T = G.trip, f = (T.seg + T.el / segTime()) / T.segs, p = T.path, n = p.length - 1, kf = Math.min(n - 1e-6, f * n), k = Math.floor(kf), r = kf - k;
    tx = lerp(X(p[k]), X(p[k + 1]), r); ty = lerp(Y(p[k]), Y(p[k + 1]), r); }
  P(g, '#24150f', Math.round(tx) - 3, Math.round(ty) - 7, 7, 5); P(g, '#ffd166', Math.round(tx) - 2, Math.round(ty) - 6, 5, 3);
  // labels (HTML, crisp)
  box.querySelectorAll('.lbl').forEach(l => l.remove());
  for (const t of TOWNS){
    const l = document.createElement('div'); l.className = 'lbl' + (t.id === G.town ? ' here' : t.id === tabs.map ? ' sel' : '');
    l.textContent = t.n; l.dataset.side = t.lbl || 'b'; l.style.left = (X(t.id) * S / dpr) + 'px'; l.style.top = (Y(t.id) * S / dpr) + 'px'; box.appendChild(l);
  }
  c.onclick = e => {
    const rct = c.getBoundingClientRect(), mx = (e.clientX - rct.left) / rct.width * W, my = (e.clientY - rct.top) / rct.height * H;
    let best = null, bd = 1e9; for (const t of TOWNS){ const d = Math.hypot(X(t.id) - mx, Y(t.id) - my); if (d < bd){ bd = d; best = t.id; } }
    if (bd < 22){ tabs.map = best; renderPanel(); }
  };
}

// ---- modals ----
let modalHandler = null;
function modal(html, onClick){ const m = $('#modal'); m.innerHTML = `<div class="mb">${html}</div>`; m.hidden = false; modalHandler = onClick; }
function closeModal(){ $('#modal').hidden = true; modalHandler = null; }
$('#modal').addEventListener('click', e => { if (modalHandler) modalHandler(e); });
function showArrival(t, lines, fares, inspect){
  const net = lines.reduce((s, l) => s + (l[1] || 0) + (l[2] || 0), 0);
  const body = lines.filter(l => l[1] || l[2] || !l[1]).map(l => `<div><span>${esc(l[0])}</span><span class="num ${(l[1] || l[2] || 0) >= 0 ? 'up' : 'dn'}">${l[1] || l[2] ? ((l[1] || l[2]) > 0 ? '+' : '') + fmt(l[1] || l[2]) : ''}</span></div>`).join('');
  const finish = () => {
    modal(`<h3>Welcome to ${esc(t.n)}!</h3><div class="t lines">${body}<div style="border:none;margin-top:4px"><b>Trip total</b><b class="num ${net >= 0 ? 'up' : 'dn'}">${net >= 0 ? '+' : ''}${fmt(net)}</b></div></div>
      <div class="ch"><button class="btn go" data-ok>Off to the market</button><button class="btn" data-x>Stay on the platform</button></div>`,
      e => { if (e.target.closest('[data-ok]')){ closeModal(); openPanel('market'); } else if (e.target.closest('[data-x]')) closeModal(); });
    if (net > 0) floatText('+' + fmt(net), '#ffd166');
  };
  if (!inspect) return finish();
  const n = moonUsed(), fine = Math.round(n * CONTRA.base * 1.6), bribe = Math.round(fine * .45);
  modal(`<h3>Inspector!</h3><div class="t">A railroad inspector boards with a lantern and starts opening crates. He finds your ${n} crates of moonshine.</div>
    <div class="ch"><button class="btn gold" data-b>Slip him a bribe (${fmt(bribe)})</button><button class="btn bad" data-f>Pay the fine (${fmt(fine)}) and lose the crates</button></div>`,
    e => {
      if (e.target.closest('[data-b]')){ if (Math.random() < .7){ G.money -= bribe; lines.push(['Bribe', -bribe]); } else { G.money -= fine + bribe; delete G.cargo.moon; lines.push(['Bribe refused! Fine', -(fine + bribe)]); } finish(); save(); refreshHud(); rerender(); }
      else if (e.target.closest('[data-f]')){ G.money -= fine; delete G.cargo.moon; lines.push(['Fine + crates seized', -fine]); finish(); save(); refreshHud(); rerender(); }
    });
}

// =====================================================================================
//  loop + start
// =====================================================================================
let last = performance.now(), hudT = 0, saveT = 0;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000) * (window.__speed || 1); last = now;
  if (G){
    update(dt);
    accrue(dt);
    drawScene();
    hudT -= dt; if (hudT <= 0){ hudT = .25; refreshHud(); if (panelName === 'map' && G.trip) drawMap(); }
    saveT -= dt; if (saveT <= 0){ saveT = 5; save(); }
    newsTimer -= dt; if (newsTimer < 0) $('#news').style.opacity = 0;
    dispMoney += (G.money - dispMoney) * Math.min(1, dt * 6); if (Math.abs(G.money - dispMoney) < 1) dispMoney = G.money;
    const m = $('#money'); const s = fmt(dispMoney); if (m.textContent !== s) m.textContent = s; m.style.color = G.money < 0 ? '#b8322f' : '#2d5a1c';
  }
  requestAnimationFrame(frame);
}
function boot(){
  G = load();
  let away = 0;
  if (G){
    const sec = Math.min(8 * 3600, Math.max(0, (Date.now() - G.wall) / 1000));
    away = Math.round(incomePerHour() * sec / 3600);
    if (away > 0){ G.money += away; G.stats.earned += away; }
  } else newGame();
  resize(); buildSprites();
  if (G.town){ V.arrive(G.town); }
  else { V.v = CRUISE; setBiome(G.trip.legs[Math.min(G.trip.seg, G.trip.legs.length - 1)]); V.fade = 1; }
  dispMoney = G.money;
  refreshHud();
  showNews(G.news[0].txt);
  if (away > 0) modal(`<h3>While you were away</h3><div class="t">Your businesses earned <b class="up">${fmt(away)}</b>.</div><div class="ch"><button class="btn go" data-ok>Nice</button></div>`, e => { if (e.target.closest('[data-ok]')) closeModal(); });
  requestAnimationFrame(t => { last = t; frame(t); });
}
addEventListener('resize', () => { resize(); if (panelName === 'map') drawMap(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else if (G){ const sec = Math.min(8 * 3600, Math.max(0, (Date.now() - G.wall) / 1000)); if (sec > 30){ const v = Math.round(incomePerHour() * sec / 3600); if (v > 0){ G.money += v; toast(`Your businesses earned ${fmt(v)} while you were away`, 'g'); } } G.wall = Date.now(); } });
addEventListener('pagehide', save);
// test hooks
window.__pr = { get G(){ return G; }, V, depart, openPanel, closePanel, segmentDone, roadEvent, refreshHud, newGame:() => { newGame(); buildSprites(); V.arrive(G.town); } };
boot();
})();
